---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app actual-budget-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: actual-budget-exporter
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      actual-budget-exporter:
        strategy: RollingUpdate
        pod:
          annotations:
            secret.reloader.stakater.com/reload: actual-budget-exporter-config

        containers:
          app:
            image:
              repository: docker.io/sakowicz/actual-budget-prometheus-exporter
              tag: 1.3.0@sha256:46edf7c983c8e2d6727a2343e6c4b17f85909160d842b544f48e8905bd3d87d8
            env:
              TZ: "${TIMEZONE}"
            envFrom:
              - secretRef:
                  name: actual-budget-exporter-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: In
                    values:
                      - worker
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
    service:
      metrics:
        controller: *app
        ports:
          metrics:
            port: 3001
