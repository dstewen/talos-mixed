---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: opentelemetry-collector
  values:
    mode: deployment
    replicaCount: 1
    fullnameOverride: otel-collector
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
      tag: 0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command:
      name: otelcol-contrib
    extraEnvs:
      - name: OTEL_BEARER_TOKEN
        valueFrom:
          secretKeyRef:
            name: otel-collector-secret
            key: OTEL_BEARER_TOKEN
      - name: INFLUXDB3_TOKEN
        valueFrom:
          secretKeyRef:
            name: otel-collector-secret
            key: INFLUXDB3_TOKEN
      - name: SVC_OTEL_COLLECTOR_ADDR
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: SVC_OTEL_COLLECTOR_ADDR
    # Disable receiver ports the chart enables by default but we don't use.
    ports:
      jaeger-compact: { enabled: false }
      jaeger-thrift: { enabled: false }
      jaeger-grpc: { enabled: false }
      zipkin: { enabled: false }
      otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        protocol: TCP
        appProtocol: grpc
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        protocol: TCP
    # Single LoadBalancer service serves both in-cluster (ClusterIP/DNS) and LAN
    # (Cilium LB IP). Off-LAN is via the external gateway HTTPRoute.
    service:
      type: LoadBalancer
      annotations:
        io.cilium/lb-ipam-ips: "${SVC_OTEL_COLLECTOR_ADDR}"
    config:
      extensions:
        # health_check is mandatory for this chart (drives the probes).
        # NOTE: $$ escapes Flux's ${VAR} postBuild substitution so the collector's
        # own ${env:...} runtime expansion survives. Flux renders $$ -> $.
        health_check:
          endpoint: 0.0.0.0:13133
        bearertokenauth:
          scheme: Bearer
          token: "${OTEL_BEARER_TOKEN}"
      receivers:
        # Null out chart defaults we don't use so they aren't merged back in.
        jaeger: null
        zipkin: null
        prometheus: null
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
              auth:
                authenticator: bearertokenauth
            http:
              endpoint: 0.0.0.0:4318
              auth:
                authenticator: bearertokenauth
      processors:
        memory_limiter:
          check_interval: 5s
          limit_percentage: 80
          spike_limit_percentage: 25
        resource:
          attributes:
            - key: deployment.environment
              value: homelab
              action: upsert
        batch: {}
      exporters:
        # DEPLOY-VERIFY: confirm the contrib influxdb exporter maps `bucket` to the
        # InfluxDB 3 database `dev-telemetry` and that `org` is accepted, against the
        # exporter README for collector 0.153.0. Adjust org/bucket/metrics_schema if needed.
        influxdb:
          endpoint: http://influxdb3.database.svc.cluster.local:8181
          token: "${INFLUXDB3_TOKEN}"
          org: telemetry
          bucket: dev-telemetry
          metrics_schema: telegraf-prometheus-v2

        # https://github.com/open-telemetry/opentelemetry-collector/blob/main/exporter/otlphttpexporter/README.md
        otlp_http/loki:
          endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
          tls:
            insecure: true

        #https://github.com/open-telemetry/opentelemetry-collector/blob/main/exporter/otlphttpexporter/README.md
        otlp_http/tempo:
          endpoint: http://tempo.monitoring.svc.cluster.local:4318
          tls:
            insecure: true

      service:
        extensions:
          - health_check
          - bearertokenauth
        pipelines:
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [influxdb]
          # traces + logs pipelines stubbed — Tempo wired in spec 3, logs stay on Loki.
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp_http/tempo]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp_http/loki]
        telemetry:
          metrics:
            level: detailed
