---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nvidia-gpu-exporter
  namespace: monitoring
spec:
  targetNamespace: monitoring
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
    # The DaemonSet is scheduled purely by the NFD GPU labels
    # (kube-system/node-feature-discovery/rules/nvidia-*-gpu-device.yaml), so it
    # would land on zero nodes if those NodeFeatureRules were not applied yet.
  #    - name: node-feature-discovery-rules
  #      namespace: kube-system
  path: ./kubernetes/apps/monitoring/nvidia-gpu-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 5m
