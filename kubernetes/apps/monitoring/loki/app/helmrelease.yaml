---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: loki
  values:
    deploymentMode: SingleBinary
    loki:
      # Customize rediness probes. Longer readiness probes set due to S3 backend
      startupProbe:
        httpGet:
          path: /ready
          port: http-metrics
        periodSeconds: 10
        initialDelaySeconds: 30
        failureThreshold: 60
      readinessProbe: {}
      livenessProbe:
        httpGet:
          path: /loki/api/v1/status/buildinfo
          port: http-metrics
        periodSeconds: 30
        successThreshold: 1
        failureThreshold: 10
        timeoutSeconds: 1
      auth_enabled: false
      analytics:
        reporting_enabled: false
      server:
        log_level: info
        grpc_server_max_recv_msg_size: 10485760 # 10 MiB
        grpc_server_max_send_msg_size: 10485760 # 10 MiB
      commonConfig:
        replication_factor: 1
      compactor:
        working_directory: /var/loki/compactor/retention
        delete_request_store: s3
        retention_enabled: true
      ingester:
        chunk_encoding: snappy
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 7d
        reject_old_samples: false
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        max_line_size: 0
        split_queries_by_interval: 15m
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16
      storage_config:
        tsdb:
          directory: /var/loki
      storage:
        type: s3
        s3: http://192.168.10.198:9000
        s3ForcePathStyle: true
        endpoint: http://192.168.10.198:9000
        bucketNames:
          chunks: talos-kernel-logs
          index: talos-kernel-logs
          ruler: talos-kernel-logs
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: openebs-hostpath-1tb
        size: 30Gi
      extraEnvs:
        - name: AWS_S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: loki-s3
              key: AWS_S3_ENDPOINT
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: loki-s3
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: loki-s3
              key: AWS_SECRET_ACCESS_KEY

    #      affinity:
    #        nodeAffinity:
    #          requiredDuringSchedulingIgnoredDuringExecution:
    #            nodeSelectorTerms:
    #            - matchExpressions:
    #              - key: node-role.kubernetes.io/worker
    #                operator: In
    #                values:
    #                - worker
    #          preferredDuringSchedulingIgnoredDuringExecution:
    #          - weight: 1
    #            preference:
    #              matchExpressions:
    #              - key: kubernetes.io/arch
    #                operator: In
    #                values:
    #                - arm64
    #        podAntiAffinity:
    #          requiredDuringSchedulingIgnoredDuringExecution:
    #            - labelSelector:
    #                matchLabels:
    #                  app.kubernetes.io/component: single-binary
    #              topologyKey: kubernetes.io/hostname

    gateway:
      replicas: 0
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    sidecar:
      image:
        repository: ghcr.io/home-operations/k8s-sidecar
        tag: 2.14.3@sha256:cc81b13164b15474260b8721bb6a63da2212a704fb92b5496091aabae3038487
      enableUniqueFilenames: true
      rules:
        searchNamespace: ALL
        folder: /rules/fake
