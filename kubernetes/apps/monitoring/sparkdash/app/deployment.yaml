---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparkdash
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sparkdash
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: sparkdash
    spec:
      containers:
        - name: sparkdash
          image: ghcr.io/dstewen/containers/sparkdash:v2.32.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5555
              name: http
              protocol: TCP
            - containerPort: 8888
              name: llm
              protocol: TCP
          env:
            - name: PORT
              value: "5555"
            - name: LLM_PORT
              value: "8888"
            - name: NODE_ENV
              value: "production"
            - name: BIND_HOST
              value: "0.0.0.0"
            - name: SSH_IDENTITY_FILE
              value: "/app/ssh/id_ed25519"
            - name: SSH_CONTROL_PERSIST_SECONDS
              value: "300"
            - name: SSH_CONNECT_TIMEOUT
              value: "10"
            # Power meters — uncomment when hardware is ready:
            # - name: POWER_METERS_CONFIG_PATH
            #   value: "/app/config/power-meters.json"
            # - name: SPARKDASH_HA_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: sparkdash-ha-token
            #       key: token
          command:
            - node
          args:
            - server/index.js
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: ssh-identity
              mountPath: /app/ssh
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sparkdash-config
        - name: ssh-identity
          secret:
            secretName: sparkdash-ssh-identity
            defaultMode: 0400
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
