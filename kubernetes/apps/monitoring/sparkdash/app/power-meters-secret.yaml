---
# Home Assistant long-lived access token — disabled until power meters are ready
# To enable: uncomment the resource reference in kustomization.yaml
# and update the token value below
apiVersion: v1
kind: Secret
metadata:
  name: sparkdash-ha-token
  namespace: monitoring
type: Opaque
# Uncomment when ready and update the value:
# stringData:
#   token: "YOUR_LONG_LIVED_HA_ACCESS_TOKEN"
