---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sparkdash-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sparkdash-exporter
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: key
          operator: Equal
          value: llm-workload
          effect: NoSchedule
    controllers:
      sparkdash-exporter:
        type: daemonset
        containers:
          app:
            image:
              repository: ghcr.io/dstewen/containers/sparkdash-exporter
              tag: "1.0.0@sha256:993b01c7529eb9d33775379c479a5b121d7329fede3ea646fb0e113a64472c93"
            env:
              PORT: "9100"
              ESPORT: "2222"
              NODE_ENV: production
              ES_ACCEPT_PASSWORD: "1" # ← enable password auth on SSH server
            envFrom:
              - secretRef:
                  name: sparkdash-exporter-secret # ← SSH password from external secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    service:
      app:
        ports:
          metrics:
            port: 9100
            protocol: TCP
            enabled: true
          ssh:
            port: 2222
            protocol: TCP
            enabled: true
