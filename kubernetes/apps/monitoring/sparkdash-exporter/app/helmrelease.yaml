---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sparkdash-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sparkdash-exporter
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/hostname
                    operator: In
                    values:
                      - spark1
                      - spark2
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
    controllers:
      sparkdash-exporter:
        type: daemonset
        containers:
          app:
            image:
              repository: ghcr.io/dstewen/containers/sparkdash-exporter
              tag: "1.0.0@sha256:1d1d80e9405ae5452740ab59fd58927e719d7507249fc528a293445db8087549"
            env:
              METRICS_PORT: "9100"
              ESPORT: "2222"
              NODE_ENV: production
              ES_ACCEPT_PASSWORD: "1" # ← enable password auth on SSH server
              SSH_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: sparkdash-exporter-secret
                    key: SSH_PASSWORD # ← SSH password from external secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    # NVIDIA device/hostPath mounts so nvidia-smi works inside the container.
    # The CUDA runtime base image (Dockerfile) provides nvidia-smi binary and
    # libnvidia-ml.so. HostPath mounts provide the kernel driver device nodes.
persistence:
  nvidia0:
    type: hostPath
    hostPath: /dev/nvidia0
    hostPathType: File
    globalMounts:
      - path: /dev/nvidia0
  nvidiactl:
    type: hostPath
    hostPath: /dev/nvidiactl
    hostPathType: File
    globalMounts:
      - path: /dev/nvidiactl
  nvidia-modeset:
    type: hostPath
    hostPath: /dev/nvidia-modeset
    hostPathType: File
    globalMounts:
      - path: /dev/nvidia-modeset
  nvidia-caps:
    type: hostPath
    hostPath: /dev/nvidia-caps
    hostPathType: File
    globalMounts:
      - path: /dev/nvidia-caps
  nvidia-smi:
    type: hostPath
    hostPath: /usr/bin/nvidia-smi
    globalMounts:
      - path: /usr/bin/nvidia-smi
        readOnly: true
  nvidia-ml:
    type: hostPath
    hostPath: /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1
    globalMounts:
      - path: /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1
        readOnly: true

    service:
      app:
        ports:
          metrics:
            port: 9100
            protocol: TCP
            enabled: true
          ssh:
            port: 2222
            protocol: TCP
            enabled: true
