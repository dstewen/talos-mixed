---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sparkdash-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sparkdash-exporter
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    defaultPodOptions:
      hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - spark1
                      - spark2
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
    controllers:
      sparkdash-exporter:
        type: daemonset
        pod:
          runtimeClassName: nvidia
        containers:
          app:
            image:
              repository: ghcr.io/dstewen/containers/sparkdash-exporter
              tag: "1.0.0@sha256:282f37b70a7164ae8e9f7e3118ac311a7653d5d0348f19230ca3d6681d2fb2d2"
            env:
              METRICS_PORT: "9101"
              ESPORT: "2222"
              NODE_ENV: production
              NVIDIA_VISIBLE_DEVICES: all
              NVIDIA_DRIVER_CAPABILITIES: utility
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    service:
      app:
        ports:
          metrics:
            port: 9101
            protocol: TCP
            enabled: true
          ssh:
            port: 2222
            protocol: TCP
            enabled: true
