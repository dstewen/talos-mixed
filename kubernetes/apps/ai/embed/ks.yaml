---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app embeddings
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/embeddings/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    # The model file lives on a CephFS PVC shared by both pool members.
    - name: rook-ceph-cluster
    # Model and InferenceService are llmkube CRDs, and its controller is what
    # turns them into Deployments.
    - name: llmkube
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
