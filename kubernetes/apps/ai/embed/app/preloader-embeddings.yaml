---
# One-off Pod to pre-stage the Qwen3-Embedding model onto the shared
# embeddings PVC at PVC root (/Qwen/...) so the InferenceService can read it
# via `pvc://embeddings/Qwen/Qwen3-Embedding-0.6B-GGUF/...` (no runtime
# download needed).
#
# IMPORTANT: write to PVC root path, not /models/ — the InferenceService
# expects the model at /Qwen/... on the embeddings PVC.
# If you mounted / to the PVC root, it fails with "mountpoint on the top of
# rootfs". So we mount the PVC at /pvc and write to /pvc/Qwen/...
#
# Run manually:
#   kubectl apply -f preloader-embeddings.yaml -n ai
#   kubectl logs -f pod/preloader-embeddings -n ai
#   kubectl delete pod preloader-embeddings -n ai
#
# Matches the pattern in llmkube/app/models/preloader.yaml:
# control-plane affinity, hf_hub Python API, chown/chmod for fsGroup 1000.
apiVersion: v1
kind: Pod
metadata:
  name: preloader-embeddings
  namespace: ai
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
  initContainers:
    - name: download-model
      image: python:3.15-slim
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -euo pipefail
          echo "[preloader] Installing huggingface_hub..."
          pip install huggingface_hub 2>&1
          echo "[preloader] Downloading Qwen3-Embedding-0.6B-Q8_0.gguf ..."
          python3 << 'EOF'
          import os
          from huggingface_hub import hf_hub_download
          repo = "Qwen/Qwen3-Embedding-0.6B-GGUF"
          file = "Qwen3-Embedding-0.6B-Q8_0.gguf"
          outdir = "/pvc/Qwen/Qwen3-Embedding-0.6B-GGUF"
          os.makedirs(outdir, exist_ok=True)
          path = hf_hub_download(repo, file, local_dir=outdir)
          print(f"[preloader] Downloaded to: {path}")
          EOF
          chown -R 1000:1000 /pvc/Qwen/Qwen3-Embedding-0.6B-GGUF
          chmod -R 755 /pvc/Qwen/Qwen3-Embedding-0.6B-GGUF
          echo "[preloader] Done"
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface
              key: HF_TOKEN
      volumeMounts:
        - name: model-cache
          mountPath: /pvc
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
  containers:
    - name: wait
      image: alpine:3.24
      command: ["sleep", "infinity"]
  volumes:
    - name: model-cache
      persistentVolumeClaim:
        claimName: embeddings
  restartPolicy: Never
