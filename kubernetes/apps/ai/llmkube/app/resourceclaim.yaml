---
# Intel iGPU (MS-01 nodes) — llama.cpp runtime
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: llmkube-models-intel-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            adminAccess: true
            allocationMode: All
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: llmkube-models-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            adminAccess: false
            allocationMode: All
