---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: llmkube
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllerManager:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
    modelCache:
      enabled: true
      mode: shared
      #      accessMode: ReadWriteMany
      #      existingClaim: llmkube-models-cache
      #      storageClass: ceph-filesystem
      #      size: 200Gi
      existingClaim: ${VOLSYNC_CLAIM}
    prometheus:
      inferencePodMonitor:
        enabled: true
