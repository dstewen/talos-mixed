---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: gemma-4-26b-a4b-it-qat
spec:
  source: pvc://llmkube/unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: intel
    gpu:
      enabled: true
      count: 1
      vendor: intel
      layers: -1
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-models-gpu
  resources:
    cpu: "500m"
    memory: 20Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: gemma-4-26b-a4b-it-qat
  labels:
    krr/ignore: "true"
spec:
  modelRef: gemma-4-26b-a4b-it-qat
  replicas: 1
  image: ghcr.io/ggml-org/llama.cpp:server-intel@sha256:b28aaaa9850ae8e4056263492f56b4592cd39bccd56d65ed5d4105464856f72a
  #  podLabels:
  #    igpu-workload: "true"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          igpu-workload: "true"
  contextSize: 131072
  parallelSlots: 2
  flashAttention: true
  batchSize: 1024
  uBatchSize: 512
  extraArgs:
    - --alias
    - gemma4_26b
    - --mmproj-url
    - pvc://llmkube-model-cache/unsloth/gemma-4-26B-A4B-it-qat-GGUF/mmproj-BF16.gguf
    - --fit
    - "off"
    - --cont-batching
    - "-sps"
    - "0.90"
    - --no-context-shift
    - --cache-prompt
    - --kv-unified
    - --image-min-tokens
    - "280"
    - --image-max-tokens
    - "280"
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "64"
    - --threads
    - "6"
    - --threads-batch
    - "6"
    - --mmap
  env:
    - name: ZES_ENABLE_SYSMAN
      value: "1"
    - name: ONEAPI_DEVICE_SELECTOR
      value: level_zero:gpu
    - name: UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS
      value: "1"
    - name: LD_LIBRARY_PATH
      value: /app
  resources:
    cpu: 500m
    memory: 20Gi
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 102
    supplementalGroups:
      - 44
      - 102
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  endpoint:
    port: 8080
    type: ClusterIP
