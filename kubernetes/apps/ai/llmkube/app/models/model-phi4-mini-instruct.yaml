---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: phi4-mini-instruct
  namespace: ai
spec:
  source: pvc://llmkube/unsloth/Phi-4-mini-instruct-GGUF/Phi-4-mini-instruct-Q4_K_M.gguf
  format: gguf
  hardware:
    accelerator: intel
    gpu:
      enabled: true
      count: 1
      vendor: intel
      layers: -1
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-models-gpu
  resources:
    cpu: "2"
    memory: "8Gi"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: phi4-mini-instruct
  namespace: ai
spec:
  modelRef: phi4-mini-instruct
  replicas: 1
  image: ghcr.io/ggml-org/llama.cpp:server-intel@sha256:5f81d305afe5dbb4f2d4e9e96d2f3b81f449b2d3c83239c758da8628e1ead01c
  resources:
    gpu: 1
    cpu: "2"
    memory: "8Gi"
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    privileged: true
