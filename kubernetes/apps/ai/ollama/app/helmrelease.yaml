---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ollama
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: ollama
  install:
    remediation:
      retries: -1
    timeout: 15m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    controllers:
      ollama:
        replicas: 1 # 1 per node

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ollama/ollama
              tag: 0.40.2
            securityContext:
              privileged: true
            env:
              TZ: Australia/Melbourne
              #LIBVA_DRIVER_NAME: i965
              #              no_proxy: localhost,127.0.0.1
              OLLAMA_HOST: 0.0.0.0
              #              DEVICE: Arc
              OLLAMA_INTEL_GPU: true
              OLLAMA_IGPU_ENABLE: 1
              #              OLLAMA_NUM_GPU: 999
              #              ZES_ENABLE_SYSMAN: 1
              OLLAMA_ORIGINS: "*"
              #              OLLAMA_LOG_LEVEL: debug
              OLLAMA_VULKAN: 1
              OLLAMA_MODELS: /models
              #              OLLAMA_NUM_CTX: 16384
              OLLAMA_KEEP_ALIVE: "10m"
              OLLAMA_NUM_PARALLEL: 1
              GGML_VK_VISIBLE_DEVICES: 0 # Force GPU0 (Intel)
              GGML_VULKAN_DEVICE: 0 # Alternative variable
              VK_DEVICE_SELECT_FORCE_DEFAULT_DEVICE: 1 # Force first physical GPU
              OLLAMA_CONTEXT_LENGTH: 32768
              #              ONEAPI_DEVICE_SELECTOR: level_zero:0
              OLLAMA_FLASH_ATTENTION: 1 # Disable Flash attention - not supported by GPU
              OLLAMA_KV_CACHE_TYPE: q4_0
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 2000m
              limits:
                memory: 32G
            envFrom:
              - secretRef:
                  name: cluster-secrets
          exporter:
            image:
              repository: lucabecker42/ollama-exporter
              tag: 1.0.3@sha256:9fb1f4c5bc4ff819eb13e148debeb7fd474a4c8956d83d39928ea22d95d3de5c
            env:
              PORT: "8000"
              INTERVAL: "30"
              OLLAMA_HOST: "localhost:11434"
              API_TIMEOUT: "30"
              LOG_LEVEL: "INFO"
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 5

    defaultPodOptions:
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: ollama-gpu
    service:
      app:
        controller: ollama
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: $${SVC_OLLAMA_ADDR}
        ports:
          http:
            port: &port 11434
          metrics:
            port: 8000

    route:
      app:
        hostnames: ["ollama.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        existingClaim: ollama-data-pvc
        advancedMounts:
          ollama:
            main:
              - path: /.ollama

      tmp:
        enabled: true
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp

      models:
        existingClaim: ollama-models-pvc
        globalMounts:
          - path: /models

      dri:
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - path: /dev/dri

      kfd:
        type: hostPath
        hostPath: /dev/kfd
        globalMounts:
          - path: /dev/kfd
