---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: ollama-rig-ornith-1.5-9b
spec:
  # This is the name your client apps (Agents/OpenClaw) will use in their API calls
  modelName: ollama-rig-ornith-1.5-9b

  params:
    model: ornith-1.5-9b
    apiBase: http://192.168.10.87:11434 # replace with your Windows PC's LAN IP
    dropParams: true
    additional:
      think: false
      options:
        num_ctx: 16384
    # We reference the secret key via environment variable mapping in the proxy
    apiKeyRef:
      name: litellm-secret
      key: OLLAMA_API_KEY

  # Explicitly link this model to your main proxy
  proxyRef: litellm
