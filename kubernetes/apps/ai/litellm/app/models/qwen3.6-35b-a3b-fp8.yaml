---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
# Model: Qwen/Qwen3.6-35B-A3B-FP8
# Recipe: qwen3.6-35b-a3b-fp8.yaml
# Single-node TP=2, FP8 KV cache, fastsafetensors
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen36-35b-a3b-fp8
spec:
  source: hf://Qwen/Qwen3.6-35B-A3B-FP8
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: fp8
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-models-gpu
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
# InferenceService: vLLM serving for Qwen3.6-35B-A3B-FP8
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen36-35b-a3b-fp8
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen36-35b-a3b-fp8
  #  modelCache:
  #    claimName: llmkube-ganyu-cache
  runtime: vllm
  image: eugr/spark-vllm-b12x@sha256:19ab778dd57f019c44caf5df91a671cf688923d1ca9fa8ce92be0c9acb46d215
  rolloutPolicy:
    #    waitForIdle: true
    force: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: high
  nodeSelector:
    kubernetes.io/hostname: spark2
  skipModelInit: true
  contextSize: 262144
  parallelSlots: 2
  batchSize: 4096
  uBatchSize: 4096
  resources:
    cpu: "2000m"
    memory: "32Gi"
    memoryLimit: "112Gi"
  endpoint:
    port: 8000
    type: ClusterIP
  extraArgs:
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
    - "--max-model-len"
    - "262144"
    - "--max-num-batched-tokens"
    - "4096"
    - "--gpu-memory-utilization"
    - "0.8"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "qwen3_xml"
    - "--reasoning-parser"
    - "qwen3"
    - "--kv-cache-dtype"
    - "fp8"
    - "--load-format"
    - "fastsafetensors"
    - "--attention-backend"
    - "flashinfer"
    - "--enable-prefix-caching"
    - "--enable-chunked-prefill"
    - "--async-scheduling"
  env:
    - name: VLLM_MARLIN_USE_ATOMIC_ADD
      value: "1"
    - name: MAX_JOBS
      value: "4"
    - name: CMAKE_BUILD_PARALLEL_LEVEL
      value: "4"
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: TRANSFORMERS_OFFLINE
      value: "1"
  extraVolumes:
    - name: local-cache
      persistentVolumeClaim:
        claimName: spark2-model-cache
  extraVolumeMounts:
    - name: local-cache
      mountPath: /root/.cache/flashinfer
      subPath: .cache/flashinfer
    - name: local-cache
      mountPath: /root/.cache/huggingface
      subPath: .cache/huggingface
    - name: local-cache
      mountPath: /root/.cache/vllm
      subPath: .cache/vllm
    - name: local-cache
      mountPath: /root/.triton
      subPath: .triton
    - name: local-cache
      mountPath: /root/.nv
      subPath: .nv
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
