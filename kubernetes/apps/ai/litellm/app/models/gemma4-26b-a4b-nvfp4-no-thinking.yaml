---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
# Recipe: nvidia/Gemma-4-26B-A4B-NVFP4
# Gemma4-26B-A4B model in NVFP4 quantization with MTP speculative decoding
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: gemma4-26b-a4b-nvfp4-no-thinking
  labels:
    krr/ignore: "true"
spec:
  modelRef: gemma4-26b-a4b-nvfp4
  #  modelCache:
  #    claimName: llmkube-ganyu-cache
  runtime: vllm
  image: eugr/spark-vllm-b12x@sha256:19ab778dd57f019c44caf5df91a671cf688923d1ca9fa8ce92be0c9acb46d215
  rolloutPolicy:
    #    waitForIdle: true
    force: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: high
  nodeSelector:
    kubernetes.io/hostname: spark1
  skipModelInit: true
  contextSize: 262144
  parallelSlots: 2
  batchSize: 4096
  uBatchSize: 4096
  resources:
    cpu: "2000m"
    memory: "32Gi"
    memoryLimit: "112Gi"
  endpoint:
    port: 8000
    type: ClusterIP
  env:
    - name: MAX_JOBS
      value: "4"
    - name: CMAKE_BUILD_PARALLEL_LEVEL
      value: "4"
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: TRANSFORMERS_OFFLINE
      value: "1"
  extraVolumes:
    - name: local-cache
      persistentVolumeClaim:
        claimName: spark1-model-cache # use spark2-model-cache for qwen3.6-35b-a3b-fp8
  extraVolumeMounts:
    - name: local-cache
      mountPath: /root/.cache/flashinfer
      subPath: .cache/flashinfer
    - name: local-cache
      mountPath: /root/.cache/huggingface
      subPath: .cache/huggingface
    - name: local-cache
      mountPath: /root/.cache/vllm
      subPath: .cache/vllm
    - name: local-cache
      mountPath: /root/.triton
      subPath: .triton
    - name: local-cache
      mountPath: /root/.nv
      subPath: .nv
  extraArgs:
    - "--served-model-name"
    - "gemma4-26b-a4b-nvfp4-no-thinking"
    - "--max-num-seqs"
    - "2"
    - "--max-model-len"
    - "262144"
    - "--gpu-memory-utilization"
    - "0.7"
    - "--host"
    - "0.0.0.0"
    - "--load-format"
    - "fastsafetensors"
    - "--enable-prefix-caching"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "gemma4"
    - "--default-chat-template-kwargs"
    - '{"enable_thinking": false}'
    - "--kv-cache-dtype"
    - "fp8"
    - "--max-num-batched-tokens"
    - "4096"
    - "--enforce-eager"
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
