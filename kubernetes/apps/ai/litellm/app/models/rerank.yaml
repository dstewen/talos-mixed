---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: rerank
spec:
  # This is the name your client apps (Agents/OpenClaw) will use in their API calls
  # memini expects model name: rerank
  modelName: rerank

  info:
    maxTokens: 16384
    maxInputTokens: 16384
    supportsFunctionCalling: false

  params:
    model: rerank
    apiKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
    # memini-rerank-1 is an InferenceService in ai namespace, port 8080
    apiBase: http://memini-rerank-1.ai:8080/v1
    # Reranker models use OpenAI-compatible /v1/rerank endpoint
  # Explicitly link this model to your main proxy
  proxyRef: litellm
