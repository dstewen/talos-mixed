# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: rerank
spec:
  source: hf://ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF
  sourceSecretRef:
    name: huggingface
  files:
    - qwen3-reranker-0.6b-q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: rerank
  labels:
    krr/ignore: "true"
spec:
  modelRef: rerank
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server
  mode: rerank
  contextSize: 8192
  parallelSlots: 2
  batchSize: 2048
  uBatchSize: 2048
  extraArgs:
    - --cont-batching
    - --load-mode
    - mmap
    - --threads
    - "8"
    - --threads-batch
    - "16"
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 300
  replicas: 1
  priority: high
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  resources:
    cpu: "2"
    memory: 8Gi
  modelCache:
    claimName: llmkube-model-cache
  endpoint:
    path: /v1/rerank
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 120
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
