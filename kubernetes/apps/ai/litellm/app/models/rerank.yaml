---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: rerank
spec:
  source: hf://ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF
  sourceSecretRef:
    name: huggingface
  files:
    - qwen3-reranker-0.6b-q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: intel
    gpu:
      enabled: true
      vendor: intel
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-models-intel-gpu
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: rerank
spec:
  modelRef: rerank
  runtime: llamacpp
  mode: rerank
  contextSize: 8192
  parallelSlots: 2
  batchSize: 2048
  uBatchSize: 2048
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --load-mode
    - mmap
    - --threads
    - "4"
    - --threads-batch
    - "4"
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 300
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: intel
  resources:
    cpu: "2"
    memory: "8Gi"
  modelCache:
    claimName: spark2-model-cache
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 120
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: rerank
  namespace: ai
spec:
  modelName: rerank
  params:
    apiBase: http://rerank.ai.svc.cluster.local:8080
    apiKey: sk-llmkube-noauth
    model: cohere/rerank-english-v3.0
