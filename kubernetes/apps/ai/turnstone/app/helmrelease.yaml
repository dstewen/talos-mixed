---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app turnstone
  namespace: &namespace ai
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: turnstone
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/turnstonelabs/turnstone
      tag: 1.9.0
    # Local Ollama configuration
    llm:
      provider: ollama
      baseUrl: http://192.168.10.87:11434
      model: llama3.2:3b # Defaulting to llama3.2:3b, can be customized
    # Secret injection via ExternalSecret
    env:
      TURNSTONE_API_KEY:
        secretKeyRef:
          name: turnstone-secret
          key: api-key
    podTemplate:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
