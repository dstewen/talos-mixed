apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: turnstone
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: turnstone-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Postgres Init (for app auto-init)
        INIT_POSTGRES_DBNAME: turnstone
        INIT_POSTGRES_HOST: &dbHost postgres18-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: &dbUser "{{ .TURNSTONE_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: &dbPass "{{ .TURNSTONE_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

        # App Connection Strings
        TURNSTONE_POSTGRES_HOST: *dbHost
        TURNSTONE_POSTGRES_USER: *dbUser
        TURNSTONE_POSTGRES_PASSWORD: *dbPass
        TURNSTONE_POSTGRES_DBNAME: turnstone

        # API Key (from 1Password)
        TURNSTONE_API_KEY: "{{ .TURNSTONE_API_KEY }}"
  dataFrom:
    - extract:
        key: turnstone
    - extract:
        key: cloudnative-pg
