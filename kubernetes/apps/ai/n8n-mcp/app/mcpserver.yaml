---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: n8n-mcp
spec:
  image: ghcr.io/czlonkowski/n8n-mcp:2.91.0
  transport: stdio
  groupRef:
    name: mcp-tools
  env:
    - name: MCP_MODE
      value: stdio
    - name: N8N_API_URL
      value: https://n8n.${SECRET_DOMAIN}
  secrets:
    - name: n8n-mcp-secret
      key: N8N_API_KEY
