---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
  dataFrom:
    - extract:
        key: memini
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-api-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        api-keys.yaml: |
          keys:
            - name: openclaw
              secret: "{{ .MEMINI_LLM_API_KEY }}"
              default_namespace: openclaw/coder
              admin: false
            - name: opencode
              secret: "{{ .OPENCODE_API_KEY }}"
              default_namespace: opencode
              admin: false
            - name: embed
              secret: "{{ .MEMINI_EMBED_API_KEY }}"
              default_namespace: openclaw/embed
              admin: false
            - name: rerank
              secret: "{{ .MEMINI_RERANK_API_KEY }}"
              default_namespace: openclaw/rerank
              admin: false
  dataFrom:
    - extract:
        key: memini
