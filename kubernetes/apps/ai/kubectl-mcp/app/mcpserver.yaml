---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubectl-mcp
spec:
  image: ghcr.io/rohitg00/kubectl-mcp-server:2.0.0
  transport: stdio
  groupRef:
    name: mcp-tools
  serviceAccountName: kubectl-mcp-sa
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  env:
    - name: HOME
      value: /tmp
  containers:
    - name: mcp
      securityContext:
        readOnlyRootFilesystem: false
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
