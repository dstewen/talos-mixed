---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-xunholy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: openclaw-xunholy-secret
    template:
      data:
        #        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        #        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        OPENCLAW_GATEWAY_TOKEN: "{{ .OPENCLAW_GATEWAY_TOKEN }}"
        #        OPENCLAW_GATEWAY_PASSWORD: "{{ .OPENCLAW_GATEWAY_PASSWORD }}"
        # SLACK API TOKENS
        SLACK_APP_TOKEN: "{{ .SLACK_OPENCLAW_APP_TOKEN }}"
        SLACK_BOT_TOKEN: "{{ .SLACK_OPENCLAW_BOT_USER_OAUTH_TOKEN }}"
        SLACK_BOT_USER_OAUTH_TOKEN: "{{ .SLACK_BOT_USER_OAUTH_TOKEN }}"
        SLACK_SIGNING_SECRET: "{{ .SLACK_OPENCLAW_APP_SIGNING_SECRET }}"
        SLACK_TALOS_HOMELAB_APP_TOKEN: "{{ .SLACK_TALOS_HOMELAB_APP_TOKEN }}"
        SLACK_USERID_ME: "{{ .SLACK_USERID_ME }}"
        SLACK_DEVOPS_CHANNEL_ID: "{{ .SLACK_DEVOPS_CHANNEL_ID }}"
        SLACK_CLAW_CHANNEL_ID: "{{ .SLACK_CLAW_CHANNEL_ID }}"
        # TELEGRAM API TOKENS
        TELEGRAM_BOT_TOKEN: "{{ .TELEGRAM_BOT_TOKEN }}"
        # Gemini API Key
        GEMINI_API_KEY: "{{ .OPENCLAW_GEMINI_API_KEY }}"
        # Discord API Keys
        DISCORD_BOT_TOKEN: "{{ .OPENCLAW_DISCORD_BOT_TOKEN }}"
        DISCORD_SERVER_ID: "{{ .DISCORD_SERVER_ID }}"
        DISCORD_CHANNEL_ID: "{{ .DISCORD_CHANNEL_ID }}"
        PLANNER_BOT_TOKEN: "{{ .PLANNER_DISCORD_BOT_TOKEN }}"
        IDEATOR_BOT_TOKEN: "{{ .IDEATOR_DISCORD_BOT_TOKEN }}"
        CRITIC_BOT_TOKEN: "{{ .CRITIC_DISCORD_BOT_TOKEN }}"
        SURVEYOR_BOT_TOKEN: "{{ .SURVEYOR_DISCORD_BOT_TOKEN }}"
        CODER_BOT_TOKEN: "{{ .CODER_DISCORD_BOT_TOKEN }}"
        WRITER_BOT_TOKEN: "{{ .WRITER_DISCORD_BOT_TOKEN }}"
        REVIEWER_BOT_TOKEN: "{{ .REVIEWER_DISCORD_BOT_TOKEN }}"
        SCOUT_BOT_TOKEN: "{{ .SCOUT_DISCORD_BOT_TOKEN }}"
        DISCORD_PLANNER_CHANNEL_ID: "{{ .DISCORD_PLANNER_CHANNEL_ID }}"
        DISCORD_IDEATOR_CHANNEL_ID: "{{ .DISCORD_IDEATOR_CHANNEL_ID }}"
        DISCORD_CRITIC_CHANNEL_ID: "{{ .DISCORD_CRITIC_CHANNEL_ID }}"
        DISCORD_SURVEYOR_CHANNEL_ID: "{{ .DISCORD_SURVEYOR_CHANNEL_ID }}"
        DISCORD_CODER_CHANNEL_ID: "{{ .DISCORD_CODER_CHANNEL_ID }}"
        DISCORD_WRITER_CHANNEL_ID: "{{ .DISCORD_WRITER_CHANNEL_ID }}"
        DISCORD_REVIEWER_CHANNEL_ID: "{{ .DISCORD_REVIEWER_CHANNEL_ID }}"
        DISCORD_SCOUT_CHANNEL_ID: "{{ .DISCORD_SCOUT_CHANNEL_ID }}"
        DISCORD_GENERAL_VOICE_CHANNEL_ID: "{{ .DISCORD_GENERAL_VOICE_CHANNEL_ID }}"
        MY_DISCORD_USERID: "{{ .MY_DISCORD_USERID }}"
        # Github Fine Grained PAT Tokens
        BACKUP_TOKEN: "{{ .OPENCLAW_BACKUP_GH_PAT }}"
        BACKUP_REPO: "{{ .OPENCLAW_BACKUP_GH_REPO }}"
        OLLAMA_API_KEY: "not-needed"
        # Groq access https://console.groq.com/
        GROQ_API_KEY: "{{ .GROQ_API_KEY }}"
        # Github PAT for access to Obsidian vault repo https://github.com/dstewen/Obsidian_Vault_Openclaw
        OPENCLAW_OBSIDIANVAULT_GH_PAT: "{{ .OPENCLAW_OBSIDIANVAULT_GH_PAT }}"
        # Mistral API Key - free tier
        MISTRAL_API_KEY: "{{ .MISTRAL_API_KEY }}"
        # Elevenlabs API key
        ELEVENLABS_API_KEY: "{{ .ELEVENLABS_API_KEY }}"
        ELEVENLABS_VOICE_ID: "{{ .ELEVENLABS_VOICE_ID }}"
        # Home-Assistant
        HA_URL: "{{ .HA_URL }}"
        # Home-Assistant Talos token
        HA_TOKEN: "{{ .HA_OPENCLAW_TOKEN }}"
        # WikiJS token
        WIKI_URL: "{{ .WIKI_URL }}"
        WIKI_KEY: "{{ .WIKI_KEY }}"
  dataFrom:
    - extract:
        key: home-assistant
    - extract:
        key: openclaw
    - extract:
        key: slackapi
    - extract:
        key: telegram-bot
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openclaw-xunholy-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        openclaw.json: |
          {
            "gateway": {
              "port": 18789,
              "mode": "local",
              "bind": "lan",
              "auth": {
                "mode": "token",
                "rateLimit": {
                  "maxAttempts": 10,
                  "windowMs": 60000,
                  "lockoutMs": 300000
                }
              },
              "controlUi": {
                "allowedOrigins": ["https://miso.davidstewen.com", "https://miso-chat.davidstewen.com", "https://mission-control.davidstewen.com"]
              },
              "trustedProxies": ["10.42.0.0/16", "192.168.0.0/16", "10.200.15.0/16"]
            },
            "agents": {
              "defaults": {
                "compaction": {
                  "reserveTokensFloor": 24000,
                  "reserveTokens": 2000,
                  "keepRecentTokens": 4000,
                  "notifyUser": true,
                  "memoryFlush": {
                    "enabled": true,
                    "softThresholdTokens": 4000,
                    "systemPrompt": "Session nearing compaction. Store durable memories now.",
                    "prompt": "Write any lasting notes to memory/YYYY-MM-DD.md; reply with NO_REPLY if nothing to store."
                  }
                },
                "memorySearch": {
                  "enabled": true,
                  "provider": "ollama",
                  "model": "nomic-embed-text",
                  "remote": {
                    "baseUrl": "http://ollama.ai.svc.cluster.local:11434",
                    "apiKey": "ollama-local"
                  },
                  "sources": ["memory"]
                },
                "model": {
                  "primary": "google/gemini-3.1-flash-lite-preview",
                  "fallbacks": [
                    "groq/llama-3.3-70b-versatile",
                    "groq/llama-3.1-8b-instant",
                    "groq/qwen/qwen3-32b",
                    "groq/openai/gpt-oss-120b",
                    "groq/openai/gpt-oss-20b",
                    "google/gemini-3-flash",
                    "google/gemini-2.5-flash",
                    "google/gemini-2.5-flash-lite",
                    "google/gemma-4-26b-a4b-it:free",
                    "google/gemma-3-27b-it:free",
                    "google/gemma-3-12b-it:free",
                    "ollama-rig/gemma4:12b-it-qat",
                    "ollama-rig/gemma4:e4b",
                    "ollama-rig/gpt-oss:20b",
                    "ollama-rig/qwen3-coder:30b",
                    "ollama-rig/deepcoder:14b",
                    "ollama-rig/qwen3.5:35b",
                    "ollama-rig/qwen3.5:9b",
                    "ollama-rig/qwen3:4b",
                    "ollama-rig/qwen3:8b",
                    "ollama-rig/qwen3-coder-next:q4_K_M",
                    "localai/qwen3.6-35b-a3b",
                    "localai/gemma3:4b",
                    "localai/gpt-oss:20b",
                    "ollama/gemma4:12b-it-qat",
                    "ollama/gpt-oss:20b",
                    "ollama/qwen3.5:35b",
                    "ollama/qwen3:4b",
                    "ollama/qwen3:8b",
                    "ollama/qwen3-coder-next:q4_K_M"
                  ]
                },
                "heartbeat": {
                  "every": "15217s",
                  "model": "groq/openai/gpt-oss-20b",
                  "isolatedSession": true,
                  "lightContext": true
                },
                "userTimezone": "Australia/Melbourne",
                "maxConcurrent": 4,
                "subagents": {
                  "maxConcurrent": 8
                },
                "timeoutSeconds": 900,
                "contextPruning": {
                  "mode": "cache-ttl",
                  "ttl": "5m",
                  "keepLastAssistants": 3,
                  "softTrimRatio": 0.3,
                  "hardClearRatio": 0.5
                }
              },
              "list": [
                {
                  "id": "main",
                  "default": true,
                  "name": "C.O.R.T.E.X",
                  "workspace": "/home/node/.openclaw/workspace",
                  "agentDir": "/home/node/.openclaw/agents/main/agent",
                  "model": {
                    "primary": "groq/qwen/qwen3.6-27b",
                    "fallbacks": [
                      "ollama-rig/gemma4:26b-a4b-it-qat",
                      "groq/llama-3.3-70b-versatile",
                      "ollama/gemma4:12b-it-qat"
                    ]
                  },
                  "subagents": { "allowAgents": ["*"] },
                  "tools": {
                    "profile": "messaging",
                    "deny": ["canvas", "browser", "exec"],
                    "elevated": { "enabled": true },
                    "alsoAllow": [
                      "bundle-mcp",
                      "group:openclaw",
                      "group:plugins",
                      "group:sessions",
                      "read",
                      "write",
                      "edit",
                      "message",
                      "sessions_spawn",
                      "sessions_yield",
                      "subagents"
                    ]
                  }
                },
                {
                  "id": "planner",
                  "name": "Planner",
                  "workspace": "/home/node/.openclaw/workspace-planner",
                  "agentDir": "/home/node/.openclaw/agents/planner/agent",
                  "model": {
                    "primary": "groq/qwen/qwen3.6-27b",
                    "fallbacks": [
                      "ollama-rig/gemma4:26b-a4b-it-qat",
                      "groq/llama-3.3-70b-versatile"
                    ]
                  },
                  "identity": {
                    "name": "Planner Bot",
                    "emoji": "🧠"
                  },
                  "tools": {
                    "profile": "coding",
                    "deny": ["canvas"],
                    "alsoAllow": ["group:openclaw", "group:plugins", "browser", "web_fetch", "web_search", "group:messaging"],
                    "elevated": { "enabled": true }
                  },
                  "groupChat": {
                    "mentionPatterns": ["@planner", "planner", "@Planner"]
                  },
                  "heartbeat": {
                    "every": "15317s",
                    "target": "discord",
                    "directPolicy": "allow",
                    "to": "channel:{{ .DISCORD_PLANNER_CHANNEL_ID }}",
                    "activeHours": { "start": "06:00", "end": "22:00" }
                  }
                },
                {
                  "id": "ideator",
                  "name": "Ideator",
                  "workspace": "/home/node/.openclaw/workspace-ideator",
                  "agentDir": "/home/node/.openclaw/agents/ideator/agent",
                  "model": {
                    "primary": "groq/qwen/qwen3.6-27b",
                    "fallbacks": [
                      "ollama-rig/gemma4:e4b",
                      "groq/llama-3.3-70b-versatile"
                    ]
                  },
                  "identity": {
                    "name": "Ideator Bot",
                    "emoji": "💡"
                  },
                  "groupChat": {
                    "mentionPatterns": ["@idea", "@ideator"]
                  },
                  "heartbeat": {
                    "every": "15417s",
                    "target": "discord",
                    "directPolicy": "allow",
                    "to": "channel:{{ .DISCORD_IDEATOR_CHANNEL_ID }}",
                    "activeHours": { "start": "06:00", "end": "22:00" }
                  }
                },
                {
                  "id": "critic",
                  "name": "Critic",
                  "workspace": "/home/node/.openclaw/workspace-critic",
                  "agentDir": "/home/node/.openclaw/agents/critic/agent",
                  "model": {
                    "primary": "groq/qwen/qwen3.6-27b",
                    "fallbacks": [
                      "ollama-rig/gemma4:e4b",
                      "groq/llama-3.3-70b-versatile"
                    ]
                  },
                  "identity": {
                    "name": "Critic Bot",
                    "emoji": "🎯"
                  },
                  "groupChat": {
                    "mentionPatterns": ["@critic", "@Critic"]
                  },
                  "heartbeat": {
                    "every": "15517s",
                    "target": "discord",
                    "directPolicy": "allow",
                    "to": "channel:{{ .DISCORD_CRITIC_CHANNEL_ID }}",
                    "activeHours": { "start": "06:00", "end": "22:00" }
                  }
                },
                {
                  "id": "surveyor",
                  "name": "Surveyor",
                  "workspace": "/home/node/.openclaw/workspace-surveyor",
                  "agentDir": "/home/node/.openclaw/agents/surveyor/agent",
                  "model": {
                    "primary": "groq/qwen/qwen3.6-27b",
                    "fallbacks": [
                      "ollama-rig/gemma4:e4b",
                      "groq/llama-3.3-70b-versatile"
                    ]
                  },
                  "identity": {
                    "name": "Surveyor Bot",
                    "emoji": "📚"
                  },
                  "groupChat": {
                    "mentionPatterns": ["@surveyor", "@survey"]
                  },
                  "heartbeat": {
                    "every": "15617s",
                    "target": "discord",
                    "directPolicy": "allow",
                    "to": "channel:{{ .DISCORD_SURVEYOR_CHANNEL_ID }}",
                    "activeHours": { "start": "06:00", "end": "22:00" }
                  }
                },
                {
                  "id": "coder",
                  "name": "Coder",
                  "workspace": "/home/node/.openclaw/workspace-coder",
                  "agentDir": "/home/node/.openclaw/agents/coder/agent",
                  "model": {
                    "primary": "ollama-rig/qwen3-coder:30b",
                    "fallbacks": [
                      "ollama-rig/gemma4:12b-it-qat",
                      "ollama-rig/gpt-oss:20b",
                      "ollama-rig/deepcoder:14b",
                      "ollama-rig/qwen3.5:35b",
                      "ollama-rig/qwen3.5:9b",
                      "ollama-rig/qwen3:4b",
                      "ollama-rig/qwen3:8b",
                      "ollama-rig/qwen3-coder-next:q4_K_M",
                      "localai/gpt-oss:20b",
                      "localai/gemma3:4b",
                      "groq/llama-3.3-70b-versatile",
                      "groq/qwen/qwen3-32b",
                      "groq/openai/gpt-oss-120b",
                      "groq/openai/gpt-oss-20b",
                      "ollama/deepcoder:1.5b",
                      "ollama/deepseek-coder-v2:16b",
                      "ollama/gemma4:e4b-it-q4_K_M",
                      "ollama/gemma4:12b-it-qat"
                    ]
                  },
                  "identity": {
                    "name": "Coder Bot",
                    "emoji": "💻"
                  },
                  "tools": {
                    "profile": "coding",
                    "deny": ["canvas"],
                    "alsoAllow": ["group:sessions", "group:messaging", "group:plugins", "web_fetch", "browser", "wiki_apply", "wiki_get", "wiki_lint", "wiki_search", "wiki_status", "bundle-mcp"],
                    "elevated": { "enabled": true }
                  },
                  "groupChat": {
                    "mentionPatterns": ["@coder", "@devops"]
                  },
                  "heartbeat": {
                    "every": "15717s",
                    "target": "discord",
                    "directPolicy": "allow",
                    "to": "channel:{{ .DISCORD_CODER_CHANNEL_ID }}",
                    "activeHours": { "start": "06:00", "end": "22:00" }
                  }
                },
                {
                  "id": "writer",
                  "name": "Writer",
                  "workspace": "/home/node/.openclaw/workspace-writer",
                  "agentDir": "/home/node/.openclaw/agents/writer/agent",
                  "model": {
                    "primary": "groq/qwen/qwen3.6-27b",
                    "fallbacks": [
                      "ollama-rig/gemma4:e4b"
                    ]
                  },
                  "identity": {
                    "name": "Writer Bot",
                    "emoji": "✍️"
                  },
                  "groupChat": {
                    "mentionPatterns": ["@writer", "@Writer"]
                  },
                  "heartbeat": {
                    "every": "15817s",
                    "target": "discord",
                    "directPolicy": "allow",
                    "to": "channel:{{ .DISCORD_WRITER_CHANNEL_ID }}",
                    "activeHours": { "start": "06:00", "end": "22:00" }
                  }
                },
                {
                  "id": "reviewer",
                  "name": "Reviewer",
                  "workspace": "/home/node/.openclaw/workspace-reviewer",
                  "agentDir": "/home/node/.openclaw/agents/reviewer/agent",
                  "model": {
                    "primary": "groq/qwen/qwen3.6-27b",
                    "fallbacks": [
                      "ollama-rig/gemma4:e4b",
                      "groq/qwen/qwen3-32b"
                    ]
                  },
                  "identity": {
                    "name": "Reviewer Bot",
                    "emoji": "🔍"
                  },
                  "groupChat": {
                    "mentionPatterns": ["@review", "@Review"]
                  },
                  "heartbeat": {
                    "every": "15917s",
                    "target": "discord",
                    "directPolicy": "allow",
                    "to": "channel:{{ .DISCORD_REVIEWER_CHANNEL_ID }}",
                    "activeHours": { "start": "06:00", "end": "22:00" }
                  }
                },
                {
                  "id": "scout",
                  "name": "Scout",
                  "workspace": "/home/node/.openclaw/workspace-scout",
                  "agentDir": "/home/node/.openclaw/agents/scout/agent",
                  "model": {
                    "primary": "groq/qwen/qwen3.6-27b",
                    "fallbacks": [
                      "ollama-rig/gemma4:e4b",
                      "groq/qwen/qwen3-32b"
                    ]
                  },
                  "identity": {
                    "name": "Scout Bot",
                    "emoji": "📰"
                  },
                  "groupChat": {
                    "mentionPatterns": ["@scout", "@Scout"]
                  },
                  "heartbeat": {
                    "every": "16117s",
                    "target": "discord",
                    "directPolicy": "allow",
                    "to": "channel:{{ .DISCORD_SCOUT_CHANNEL_ID }}",
                    "activeHours": { "start": "06:00", "end": "22:00" }
                  }
                }
              ]
            },
            "bindings": [

              {
                "agentId": "main", "match": { "channel": "discord", "accountId": "default" }
              },
              {
                "agentId": "planner", "match": { "channel": "discord", "accountId": "planner" }
              },
              {
                "agentId": "ideator", "match": { "channel": "discord", "accountId": "ideator" }
              },
              {
                "agentId": "critic", "match": { "channel": "discord", "accountId": "critic" }
              },
              {
                "agentId": "surveyor", "match": { "channel": "discord", "accountId": "surveyor" }
              },
              {
                "agentId": "coder", "match": { "channel": "discord", "accountId": "coder" }
              },
              {
                "agentId": "writer", "match": { "channel": "discord", "accountId": "writer" }
              },
              {
                "agentId": "reviewer", "match": { "channel": "discord", "accountId": "reviewer" }
              },
              {
                "agentId": "scout", "match": { "channel": "discord", "accountId": "scout" }
              },

              {
                "agentId": "main",
                "match": {
                  "channel": "discord",
                  "peer": { "kind": "channel", "id": "{{ .DISCORD_CHANNEL_ID }}" }
                }
              },
              {
                "agentId": "planner",
                "match": {
                  "channel": "discord",
                  "peer": { "kind": "channel", "id": "{{ .DISCORD_PLANNER_CHANNEL_ID }}" }
                }
              },
              {
                "agentId": "ideator",
                "match": {
                  "channel": "discord",
                  "peer": { "kind": "channel", "id": "{{ .DISCORD_IDEATOR_CHANNEL_ID }}" }
                }
              },
              {
                "agentId": "critic",
                "match": {
                  "channel": "discord",
                  "peer": { "kind": "channel", "id": "{{ .DISCORD_CRITIC_CHANNEL_ID }}" }
                }
              },
              {
                "agentId": "surveyor",
                "match": {
                  "channel": "discord",
                  "peer": { "kind": "channel", "id": "{{ .DISCORD_SURVEYOR_CHANNEL_ID }}" }
                }
              },
              {
                "agentId": "coder",
                "match": {
                  "channel": "discord",
                  "peer": { "kind": "channel", "id": "{{ .DISCORD_CODER_CHANNEL_ID }}" }
                }
              },
              {
                "agentId": "writer",
                "match": {
                  "channel": "discord",
                  "peer": { "kind": "channel", "id": "{{ .DISCORD_WRITER_CHANNEL_ID }}" }
                }
              },
              {
                "agentId": "reviewer",
                "match": {
                  "channel": "discord",
                  "peer": { "kind": "channel", "id": "{{ .DISCORD_REVIEWER_CHANNEL_ID }}" }
                }
              },
              {
                "agentId": "scout",
                "match": {
                  "channel": "discord",
                  "peer": { "kind": "channel", "id": "{{ .DISCORD_SCOUT_CHANNEL_ID }}" }
                }
              }
            ],
            "models": {
              "providers": {
                "ollama-rig": {
                  "baseUrl": "http://192.168.10.87:11434",
                  "apiKey": "not-needed",
                  "api": "ollama",
                  "timeoutSeconds": 600,
                  "models": [
                    {
                      "id": "deepcoder:1.5b",
                      "name": "DeepCoder 1.5B (Ollama Rig)",
                      "reasoning": true,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 128000,
                      "maxTokens": 8192,
                      "params": {
                        "num_ctx": 128000
                      }
                    },
                    {
                      "id": "deepcoder:14b",
                      "name": "DeepCoder 14B (Ollama Rig)",
                      "reasoning": true,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 128000,
                      "maxTokens": 8192,
                      "params": {
                        "num_ctx": 128000
                      }
                    },
                    {
                      "id": "deepseek-coder:1.3b",
                      "name": "DeepSeek-Coder 1.3B (Ollama Rig)",
                      "reasoning": true,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 16384,
                      "maxTokens": 8192,
                      "params": {
                        "num_ctx": 16384
                      }
                    },
                    {
                      "id": "deepseek-coder-v2:16b",
                      "name": "DeepSeek-Coder-V2 16B (Ollama Rig)",
                      "reasoning": true,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 163840,
                      "maxTokens": 8192,
                      "params": {
                        "num_ctx": 163840
                      }
                    },
                    {
                      "id": "deepseek-ocr:3b",
                      "name": "DeepSeek-OCR 3B (Ollama Rig)",
                      "reasoning": true,
                      "input": ["text", "image"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 8192,
                      "maxTokens": 8192,
                      "params": {
                        "num_ctx": 8192
                      }
