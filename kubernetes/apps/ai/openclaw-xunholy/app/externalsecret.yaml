# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openclaw-mission-control
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        AUTH_USER: "{{ .AUTH_USER }}"
        AUTH_PASS: "{{ .AUTH_PASSWORD }}"
        API_KEY: "{{ .API_KEY }}"
        OPENCLAW_GATEWAY_TOKEN: "{{ .OPENCLAW_GATEWAY_TOKEN }}"
        # Google LLMs API Key
        GOOGLE_API_KEY: "{{ .OPENCLAW_GEMINI_API_KEY }}"
        # TELEGRAM API TOKENS
        TELEGRAM_BOT_TOKEN: "{{ .TELEGRAM_BOT_TOKEN }}"
        # Github Fine Grained PAT Tokens
        BACKUP_TOKEN: "{{ .OPENCLAW_BACKUP_GH_PAT }}"
        BACKUP_REPO: "{{ .OPENCLAW_BACKUP_GH_REPO }}"
        # Home-Assistant Talos token
        HA_OPENCLAW_TOKEN: "{{ .HA_OPENCLAW_TOKEN }}"
        OLLAMA_API_KEY: "not-needed"
        # Groq access https://console.groq.com/
        GROQ_API_KEY: "{{ .GROQ_API_KEY }}"
        # Github PAT for access to Obsidian vault repo https://github.com/dstewen/Obsidian_Vault_Openclaw
        OPENCLAW_OBSIDIANVAULT_GH_PAT: "{{ .OPENCLAW_OBSIDIANVAULT_GH_PAT }}"
        # Mistral API Key - free tier
        MISTRAL_API_KEY: "{{ .MISTRAL_API_KEY }}"
        # Elevenlabs API key
        ELEVENLABS_API_KEY: "{{ .ELEVENLABS_API_KEY }}"
        ELEVENLABS_VOICE_ID: "{{ .ELEVENLABS_VOICE_ID }}"
  dataFrom:
    - extract:
        key: mission-control
    - extract:
        key: home-assistant
    - extract:
        key: openclaw
    - extract:
        key: telegram-bot
  data:
    - secretKey: OPENCLAW_GATEWAY_TOKEN
      remoteRef:
        key: openclaw
        property: OPENCLAW_GATEWAY_TOKEN
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name autensa-mission-control-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        AUTH_USER: "{{ .AUTH_USER }}"
        AUTH_PASS: "{{ .AUTH_PASSWORD }}"
        API_KEY: "{{ .API_KEY }}"
        OPENCLAW_GATEWAY_TOKEN: "{{ .OPENCLAW_GATEWAY_TOKEN }}"
        # Google LLMs API Key
        GOOGLE_API_KEY: "{{ .OPENCLAW_GEMINI_API_KEY }}"
        # TELEGRAM API TOKENS
        TELEGRAM_BOT_TOKEN: "{{ .TELEGRAM_BOT_TOKEN }}"
        # Github Fine Grained PAT Tokens
        BACKUP_TOKEN: "{{ .OPENCLAW_BACKUP_GH_PAT }}"
        BACKUP_REPO: "{{ .OPENCLAW_BACKUP_GH_REPO }}"
        # Home-Assistant Talos token
        HA_OPENCLAW_TOKEN: "{{ .HA_OPENCLAW_TOKEN }}"
        OLLAMA_API_KEY: "not-needed"
        # Groq access https://console.groq.com/
        GROQ_API_KEY: "{{ .GROQ_API_KEY }}"
        # Github PAT for access to Obsidian vault repo https://github.com/dstewen/Obsidian_Vault_Openclaw
        OPENCLAW_OBSIDIANVAULT_GH_PAT: "{{ .OPENCLAW_OBSIDIANVAULT_GH_PAT }}"
        # Mistral API Key - free tier
        MISTRAL_API_KEY: "{{ .MISTRAL_API_KEY }}"
        # Elevenlabs API key
        ELEVENLABS_API_KEY: "{{ .ELEVENLABS_API_KEY }}"
        ELEVENLABS_VOICE_ID: "{{ .ELEVENLABS_VOICE_ID }}"
  dataFrom:
    - extract:
        key: mission-control
    - extract:
        key: home-assistant
    - extract:
        key: openclaw
    - extract:
        key: telegram-bot
  data:
    - secretKey: OPENCLAW_GATEWAY_TOKEN
      remoteRef:
        key: openclaw
        property: OPENCLAW_GATEWAY_TOKEN
