---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mcpserver-to-kubectl
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app: kubectl
      toolhive: "true"
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: mcpserver
            toolhive: "true"
            toolhive-name: kubectl
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
