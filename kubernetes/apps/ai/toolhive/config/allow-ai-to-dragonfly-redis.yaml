apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ai-to-dragonfly-redis
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
