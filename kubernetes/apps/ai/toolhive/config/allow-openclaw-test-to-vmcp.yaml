---
# Allow openclaw-test to reach VirtualMCPServer on port 4483
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-openclaw-test-to-vmcp
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: virtualmcpserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: openclaw-test
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
