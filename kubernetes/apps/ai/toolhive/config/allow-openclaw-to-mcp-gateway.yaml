apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-openclaw-to-mcp-gateway
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app: virtualmcpserver
      toolhive: "true"
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: name
              operator: In
              values:
                - openclaw-test
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
