apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-dragonfly-operator-control
  namespace: ai # Placed inside the destination namespace
spec:
  endpointSelector:
    matchLabels:
      app: toolhive-operator-config-dragonfly
  ingress:
    - fromEndpoints:
        - matchLabels:
            # Matches the source namespace label injected by Cilium
            io.kubernetes.pod.namespace: database
            app: dragonfly-operator
      toPorts:
        - ports:
            # Allows the operator to connect to Dragonfly management/admin ports
            - port: "9999"
              protocol: TCP
