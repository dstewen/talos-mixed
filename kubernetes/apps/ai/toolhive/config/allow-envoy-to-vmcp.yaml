---
# Allow Envoy gateway pods to reach VirtualMCPServer pods on port 4483
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-envoy-to-vmcp
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: virtualmcpserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
