apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: global-allow-dragonfly-management
spec:
  endpointSelector:
    matchLabels:
      "io.kubernetes.pod.namespace": ai
      name: dragonfly
  ingress:
    - fromEndpoints:
        - matchLabels:
            "io.kubernetes.pod.namespace": database
            name: dragonfly-operator
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
