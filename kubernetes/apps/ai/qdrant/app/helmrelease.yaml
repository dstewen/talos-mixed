---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qdrant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: qdrant
  values:
    controllers:
      qdrant:
        annotations:
          reloader.stakater.com/auto: "true"
          prometheus.io/scrape: "true"
          prometheus.io/port: "6333"
        containers:
          app:
            image:
              repository: qdrant/qdrant
              tag: v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
            env:
              QDRANT__SERVICE__HTTP_PORT: &http-port 6333
              QDRANT__SERVICE__GRPC_PORT: &grpc-port 6334
              QDRANT__SERVICE__ENABLE_CORS: "false"
              QDRANT__TELEMETRY__DISABLE: "true"
              # Default snapshots path is ./snapshots (qdrant's WORKDIR
              # /qdrant), which the non-root user can't create. Redirect
              # to the existing PVC so snapshots are also durable.
              QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots

            envFrom:
              - secretRef:
                  name: qdrant-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *http-port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                # Sized for the initial Paperless ingest + Phase A
                # dual-collection benchmark (200 docs × 2 embedders).
                # Pre-Spark-unblocks-RAG sizing (256Mi/512Mi) was fine
                # for 0 collections but will OOM during ingest. Revisit
                # downward after the first full ingest measures resident
                # set in steady state.
                memory: 1Gi
              limits:
                memory: 4Gi
            ports:
              - name: http
                containerPort: *http-port
              - name: grpc
                containerPort: *grpc-port
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *http-port
          grpc:
            port: *grpc-port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: Qdrant
          gethomepage.dev/href: https://qdrant.davidstewen.com
          gethomepage.dev/icon: sh-qdrant.png
          gethomepage.dev/pod-selector: app.kubernetes.io/name=qdrant
          hajimari.io/appName: "Qdrant"
          hajimari.io/enable: "true"
          hajimari.io/group: "AI"
        hostnames: ["{{ .Release.Name }}.davidstewen.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *http-port
    persistence:
      data:
        existingClaim: qdrant-data-pvc
        advancedMounts:
          qdrant:
            app:
              - path: /qdrant/storage
