---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: open-webui
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      open-webui:
        type: statefulset

        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom:
              - secretRef:
                  name: open-webui-secret

        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f

            env:
              GLOBAL_LOG_LEVEL: DEBUG
              #              OLLAMA_BASE_URL: http://ollama.ai.svc.cluster.local:11434
              ENABLE_RAG_WEB_SEARCH: true
              RAG_WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng.selfhosted.svc.cluster.local:8080/search?q=<query>
              ENABLE_REALTIME_CHAT_SAVE: true
              # Redis
              # https://docs.openwebui.com/getting-started/advanced-topics/env-configuration/#redis
              ENABLE_WEBSOCKET_SUPPORT: true
              WEBSOCKET_MANAGER: "redis"
              WEBSOCKET_REDIS_URL: "redis://open-webui-dragonfly:6379"
              # Vector DB
              VECTOR_DB: qdrant
              QDRANT_URI: http://qdrant.ai.svc.cluster.local:6333
              #              AUDIO_OPENAI_API_BASE_URL: https://piper.${SECRET_DOMAIN}/v1
              AUDIO_OPENAI_API_KEY: sk-111111111111 # fake key needed to make ui happy
              ENABLE_OPENAI_API: true
              # LocalAI backends (Intel: chat/embed/whisper/tts, NVIDIA: coder models)
              OPENAI_API_BASE_URLS: "http://local-ai-intel.ai.svc.cluster.local:8080/v1"
              OPENAI_API_KEYS: "not-needed;not-needed"
              ENABLE_OAUTH_SIGNUP: true
              ENABLE_OAUTH_GROUP_MANAGEMENT: true
              ENABLE_OAUTH_GROUP_CREATION: true
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
              OAUTH_PROVIDER_NAME: Authentik
              OAUTH_SCOPES: "openid email profile"
              #              TZ: ${TIMEZONE}
              # Telemetry
              SCARF_NO_ANALYTICS: "true"
              DO_NOT_TRACK: "true"
              ANONYMIZED_TELEMETRY: "false"
            envFrom:
              - secretRef:
                  name: open-webui-secret
              - secretRef:
                  name: cluster-secrets
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 4Gi
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: In
                    values:
                      - worker
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: 8080

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/icon: open-webui.png
          hajimari.io/appName: "Open Web UI"
          hajimari.io/enable: "true"
          hajimari.io/group: "AI"
          internal-dns.alpha.kubernetes.io/target: internal.davidstewen.com
        enabled: true
        hostnames: ["open-webui.davidstewen.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      config:
        existingClaim: open-webui-data
        globalMounts:
          - path: /app/backend/data
