---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-ai-intel
spec:
  chartRef:
    kind: OCIRepository
    name: local-ai-intel
  #  dependsOn: []
  interval: 15m
  values:
    controllers:
      local-ai-intel:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: RollingUpdate
        rollingUpdate:
          surge: 0
          unavailable: 1
        containers:
          app:
            image:
              repository: quay.io/go-skynet/local-ai
              tag: v4.11.0-gpu-intel@sha256:151f929664e03b129cdb91f6bcba1def76a9733d22c35f66a3f026c67e386e7c
            args:
              - "run"
              - "--enable-memory-reclaimer"
              - "--memory-reclaimer-threshold=0.8"
              - "--enable-watchdog-idle"
              - "--watchdog-idle-timeout=15m"
            securityContext:
              privileged: true
            env:
              LOCALAI_MODELS_PATH: /models
              LOCALAI_EXTERNAL_BACKENDS: "llama-cpp,whisper,piper"
              LOCALAI_MAX_ACTIVE_BACKENDS: 3
              DEBUG: "true"
            envFrom:
              - secretRef:
                  name: cluster-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: &port 8080
                  initialDelaySeconds: 300
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 120
                  periodSeconds: 15
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 800m
                memory: 16Gi
              limits:
                memory: 64Gi
        pod:
          #          affinity:
          #            podAntiAffinity:
          #              requiredDuringSchedulingIgnoredDuringExecution:
          #                - topologyKey: kubernetes.io/hostname
          #                  labelSelector:
          #                    matchExpressions:
          #                      - key: app.kubernetes.io/name
          #                        operator: In
          #                        values:
          #                          - local-ai-intel
          #                          - plex
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: local-ai-gpu
    service:
      app:
        controller: local-ai-intel
        ports:
          http:
            port: 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: LocalAI
          gethomepage.dev/icon: sh-localai.png
          gethomepage.dev/pod-selector: app.kubernetes.io/name=local-ai-intel
          hajimari.io/appName: "LocalAI"
          hajimari.io/enable: "true"
          hajimari.io/group: "AI"
          internal-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hostnames:
          - local-ai.davidstewen.com
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      models:
        existingClaim: local-ai-models-intel
        globalMounts:
          - path: /models
      config:
        type: configMap
        name: local-ai-config-intel
        globalMounts:
          - path: /models/mistral-7b-instruct.yaml
            subPath: mistral-7b-instruct.yaml
          - path: /models/nomic-embed-text.yaml
            subPath: nomic-embed-text.yaml
          - path: /models/whisper-base.yaml
            subPath: whisper-base.yaml
          - path: /models/piper-tts.yaml
            subPath: piper-tts.yaml
      backends:
        type: emptyDir
        globalMounts:
          - path: /backends
      dri:
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - path: /dev/dri
