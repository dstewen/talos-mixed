---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openclaw-test
spec:
  chartRef:
    kind: OCIRepository
    name: openclaw-test
  #  dependsOn: []
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          install-tools:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.9.8@sha256:d0ded1dd76939b2bf4d67ef2d13247b8b160aa5666331d4a0b0e58811182cbb8
            command:
              - /bin/sh
              - -c
              - |
                set -e
                mkdir -p /home/node/.local/bin /home/node/.local/go

                echo "Starting tool installation..."

                # Install gh CLI if not present on PVC
                if [ ! -f /home/node/.local/bin/gh ]; then
                  echo "Installing gh CLI..."
                  cd /tmp
                  curl -fsSL https://github.com/cli/cli/releases/download/v2.61.0/gh_2.61.0_linux_amd64.tar.gz -o gh.tar.gz
                  tar xzf gh.tar.gz
                  cp gh_2.61.0_linux_amd64/bin/gh /home/node/.local/bin/
                  rm -rf gh.tar.gz gh_2.61.0_linux_amd64
                fi

                if [ ! -f /home/node/.local/bin/openclaw ]; then
                # Set up openclawbot CLI symlink
                  echo "Installing creating symlink..."
                  ln -s /app/openclaw.mjs /home/node/.local/bin/openclaw
                fi

                # Install Go if not present on PVC
                if [ ! -f /home/node/.local/go/bin/go ]; then
                  echo "Installing Go..."
                  cd /tmp
                  curl -fsSL https://go.dev/dl/go1.23.5.linux-amd64.tar.gz -o go.tar.gz
                  tar xzf go.tar.gz
                  mv go /home/node/.local/
                  rm -rf go.tar.gz
                fi

                # Install Homebrew if not present on PVC
                if [ ! -f /home/node/.local/homebrew/bin/brew ]; then
                  echo "Installing Homebrew..."
                  export HOMEBREW_PREFIX=/home/node/.local/homebrew
                  export HOMEBREW_CELLAR=/home/node/.local/homebrew/Cellar
                  export HOMEBREW_REPOSITORY=/home/node/.local/homebrew
                  mkdir -p $HOMEBREW_PREFIX
                  cd /tmp
                  git clone --depth 1 https://github.com/Homebrew/brew $HOMEBREW_PREFIX
                fi

                # Check if pip is available (either standalone or via python3 -m pip)
                set +e # Don't fail on pip errors
                if command -v pip3 >/dev/null 2>&1 || command -v pip >/dev/null 2>&1 || python3 -m pip --version >/dev/null 2>&1; then
                  echo "pip is available"
                else
                  echo "Installing pip..."
                  cd /tmp
                  curl -fsSL https://bootstrap.pypa.io/get-pip.py -o get-pip.py
                  python3 get-pip.py --user --no-warn-script-location --break-system-packages || \
                  python3 get-pip.py --user --no-warn-script-location || \
                  echo "pip install skipped (use python3 -m pip instead)"
                  rm -f get-pip.py
                fi
                set -e # Re-enable error checking

                echo "Tool installation complete"

                # Ensure config directory exists
                mkdir -p /home/node/.openclaw
                mkdir -p /home/node/.openclaw/agents/main/sessions
                mkdir -p /home/node/.openclaw/credentials
                mkdir -p /home/node/.openclaw/extensions
                mkdir -p /home/node/.openclaw/logs
                mkdir -p /home/node/.openclaw/state
                rm -f /home/node/.openclaw/openclaw.json
                cp /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chown 1000:1000 /home/node/.openclaw/openclaw.json
                chown 1000:1000 /home/node/.openclaw/agents
                chown 1000:1000 /home/node/.openclaw/extensions
                chown -R 1000:1000 /home/node/.openclaw/
                chown -R 1000:1000 /home/node/.local/bin
                chmod 400 /home/node/.openclaw/openclaw.json
                chmod +t /tmp
                echo "Init container completed successfully"
            env:
              TERM: xterm-256color
            envFrom:
              - secretRef:
                  name: openclaw-test-secret
            securityContext:
              # Runs as root: doctor/session-sqlite migration steps need to chmod/chown
              # files across ownership boundaries, and this cluster's container runtime
              # doesn't propagate added Linux capabilities to non-root processes (verified
              # empirically — capabilities.add lands in the bounding set only, never
              # effective/ambient, for a non-zero runAsUser). Scoped to this one-shot init
              # step; the app container keeps its non-root, all-capabilities-dropped profile.
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.9.8@sha256:d0ded1dd76939b2bf4d67ef2d13247b8b160aa5666331d4a0b0e58811182cbb8
            command:
              - /bin/sh
              - -c
              - |
                # Install non-bundled ClawHub plugins
                node dist/index.js plugins install "clawhub:@openclaw/discord" --force --accept-capabilities
                node dist/index.js plugins install "clawhub:@openclaw/searxng-plugin" --force --accept-capabilities
                node dist/index.js plugins install "clawhub:@openclaw/mistral-provider" --force --accept-capabilities
                # Start gateway
                exec node dist/index.js gateway --bind lan
            env:
              #              BROWSER_WS_ENDPOINT: "ws://localhost:9222"
              #              DOCKER_HOST: "tcp://localhost:2376"
              #              DOCKER_CERT_PATH: /certs/client
              #              DOCKER_TLS_VERIFY: "1"
              - name: GOPATH
                value: /home/node/go
              - name: HOME
                value: &homepath /home/node
              - name: HOMEBREW_CELLAR
                value: /home/node/.local/homebrew/Cellar
              - name: HOMEBREW_PREFIX
                value: /home/node/.local/homebrew
              - name: HOMEBREW_REPOSITORY
                value: /home/node/.local/homebrew
              - name: NODE_OPTIONS
                value: "--max-old-space-size=4096"
              - name: OPENAI_API_BASE_URL
                value: "http://local-ai-intel.ai.svc.cluster.local:8080/v1"
              - name: OPENAI_API_KEY
                value: "not-needed"
              - name: OPENCLAW_GATEWAY_PORT
                value: &port 18789
              - name: OPENCLAW_LOG_LEVEL
                value: info
              - name: PATH
                value: /home/node/.local/bin:/home/node/.local/homebrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              - name: PIP_BREAK_SYSTEM_PACKAGES
                value: "1"
              # Enable SearXNG plugin
              - name: SEARXNG_BASE_URL
                value: http://searxng.selfhosted.svc.cluster.local:8080
              - name: SEARXNG_FORMAT
                value: json
              - name: TERM
                value: xterm-256color
              - name: TZ
                value: "$${TIMEZONE}"
              - name: LITELLM_API_KEY
                value: "sk-dVujhw0SK5rF1FAyQG-dmQ"
            envFrom:
              - secretRef:
                  name: openclaw-test-secret
              - secretRef:
                  name: cluster-secrets

            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 8Gi

          #          git-sync:
          #            image:
          #              repository: registry.k8s.io/git-sync/git-sync
          #              tag: v4.4.0
          #              pullPolicy: IfNotPresent
          #            args:
          #              - "--repo=git@github.com:dstewen/openclaw-backup.git"
          #              - "--root=/config-sync"
          #              - "--period=21600s"
          #              - "--one-time=false"
          #            resources:
          #              requests:
          #                memory: "64Mi"
          #                cpu: "50m"
          #              limits:
          #                memory: "128Mi"
          #                cpu: "100m"

          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.140.0@sha256:1c9ad972a78450f430155144110da4c02d3627c72a598e9197e2781fb9f92e28
            env:
              TZ: Australia/Melbourne
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/home/node/.vscode",
                "--extensions-dir",
                "/home/node/.vscode",
                "--port",
                "12321",
                "/home/node/.openclaw",
              ]
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 4Gi

    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      shareProcessNamespace: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: $${SVC_POSTGRES16_ADDR}
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: *port
          code-server:
            port: &codeserverPort 12321
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: OpenClaw
          gethomepage.dev/href: https://miso-test.davidstewen.com
          gethomepage.dev/icon: sh-openclaw.png
          gethomepage.dev/pod-selector: app.kubernetes.io/name=openclaw-test
          internal-dns.alpha.kubernetes.io/target: internal.davidstewen.com
        hostnames: ["miso-test.davidstewen.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *port

      code-server:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: OpenClaw VSCode Test
          gethomepage.dev/href: https://miso-code-test.davidstewen.com
          gethomepage.dev/icon: sh-visual-studio-code.png
          hajimari.io/appName: "OpenClaw"
          hajimari.io/enable: "true"
          hajimari.io/group: "AI"
        hostnames: ["miso-code-test.davidstewen.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *codeserverPort
    rbac:
      roles:
        openclaw-test-read-all:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources:
                [
                  "pods",
                  "nodes",
                  "services",
                  "namespaces",
                  "configmaps",
                  "persistentvolumes",
                  "persistentvolumeclaims",
                  "endpoints",
                  "resourcequotas",
                  "limitranges",
                  "serviceaccounts",
                  "events",
                ] # Added events
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["pods/log"]
              verbs: ["get", "list"]
            - apiGroups: ["apps"]
              resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["batch"]
              resources: ["jobs", "cronjobs"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["networking.k8s.io"]
              resources: ["ingresses", "networkpolicies"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["storage.k8s.io"]
              resources: ["storageclasses"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["metrics.k8s.io"]
              resources: ["nodes", "pods"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["helm.toolkit.fluxcd.io"]
              resources: ["helmreleases"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["kustomize.toolkit.fluxcd.io"]
              resources: ["kustomizations"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["external-secrets.io"]
              resources: ["externalsecrets"]
              verbs: ["get", "list", "watch"]
        openclaw-test-write-restricted:
          type: Role
          rules:
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["delete"]
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["delete"]
            - apiGroups: [""]
              resources: ["pods/exec"]
              verbs: ["create"]
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["patch", "update"]
      bindings:
        openclaw-test-read-all:
          type: ClusterRoleBinding
          roleRef:
            identifier: openclaw-test-read-all
          subjects:
            - identifier: openclaw-test
              serviceAccount: openclaw-test
        openclaw-test-write-restricted:
          type: RoleBinding
          roleRef:
            identifier: openclaw-test-write-restricted
          subjects:
            - identifier: openclaw-test
              serviceAccount: openclaw-test
    serviceAccount:
      openclaw-test: {}

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: *homepath

      #      data:
      #        type: nfs
      #        server: 192.168.10.15
      #        path: /volume2/piNFS01/flux-cluster/miso
      #        globalMounts:
      #          - path: /data

      #      downloads:
      #        type: nfs
      #        server: 192.168.10.15
      #        path: /mnt/akademiya/data
      #        globalMounts:
      #          - path: /downloads
      #            subPath: metube

      #      images:
      #        type: nfs
      #        server: 192.168.10.15
      #        path: /mnt/daena/comfyui/output
      #        globalMounts:
      #          - path: /home/node/.openclaw/workspace/images

      configmap:
        type: configMap
        name: "{{ .Release.Name }}-config"
        defaultMode: 0644
        globalMounts:
          - path: /tmp/openclaw.json
            subPath: openclaw.json
      next-cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      #      certs:
      #        type: emptyDir
      # Map workspaces - seperate PVC for each agent
      ws-planner:
        existingClaim: "openclaw-test-ws-planner"
        globalMounts:
          - path: /home/node/.openclaw/workspace-planner

      ws-ideator:
        existingClaim: "openclaw-test-ws-ideator"
        globalMounts:
          - path: /home/node/.openclaw/workspace-ideator

      ws-critic:
        existingClaim: "openclaw-test-ws-critic"
        globalMounts:
          - path: /home/node/.openclaw/workspace-critic

      ws-surveyor:
        existingClaim: "openclaw-test-ws-surveyor"
        globalMounts:
          - path: /home/node/.openclaw/workspace-surveyor

      ws-coder:
        existingClaim: "openclaw-test-ws-coder"
        globalMounts:
          - path: /home/node/.openclaw/workspace-coder

      ws-writer:
        existingClaim: "openclaw-test-ws-writer"
        globalMounts:
          - path: /home/node/.openclaw/workspace-writer

      ws-reviewer:
        existingClaim: "openclaw-test-ws-reviewer"
        globalMounts:
          - path: /home/node/.openclaw/workspace-reviewer

      ws-scout:
        existingClaim: "openclaw-test-ws-scout"
        globalMounts:
          - path: /home/node/.openclaw/workspace-scout
