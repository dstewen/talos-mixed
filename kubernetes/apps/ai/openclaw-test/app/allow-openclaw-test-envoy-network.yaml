---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-openclaw-test-envoy-network
  namespace: ai # Placed inside the destination namespace
spec:
  endpointSelector:
    matchLabels:
      instance: openclaw-test
  ingress:
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            # Allows the operator to connect to Dragonfly management/admin ports
            - port: "18789"
              protocol: TCP
