---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-openclaw-test-envoy-network
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: openclaw-test
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
        - matchLabels:
            io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "18789"
              protocol: TCP
            - port: "18790"
              protocol: TCP
            - port: "18794"
              protocol: TCP
