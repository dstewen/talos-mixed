---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openclaw-operator
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    replicaCount: 1
    networkPolicy:
      enabled: true
    # Metrics configuration
    metrics:
      enabled: true
      bindAddress: ":8443"
      secure: false
      # Service for operator metrics endpoint
      service:
        port: 8443
        annotations: {}
      # ServiceMonitor for Prometheus Operator scraping
      serviceMonitor:
        enabled: true
        interval: ""
        scrapeTimeout: ""
        labels: {}
    otlp:
      enabled: true
      endpoint: "otel-collector.monitoring.svc:4317"
      insecure: true
