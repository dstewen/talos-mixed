---
# yaml-language-server: $schema=https://raw.githubusercontent.com/openclaw-rocks/openclaw-operator/main/config/crd/bases/openclaw.rocks_openclawinstances.yaml
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: cortana
  namespace: ai
spec:
  backup:
    schedule: "0 4 * * *" # Daily at 4 AM UTC
    historyLimit: 5 # Successful job runs to retain (default: 3)
    failedHistoryLimit: 1 # Failed job runs to retain (default: 1)
    timeout: "1h"
  image:
    repository: ghcr.io/openclaw/openclaw
    # renovate: datasource=docker depName=ghcr.io/openclaw/openclaw
    tag: 2026.6.35@sha256:e182383a604b50b11bdc48e9eca39e2c3089bef9f5606393bff07c7796e46883
  # ── Self-Configure ────────────────────────────────────────────
  # Let the agent add/remove skills and config at runtime via K8s API
  # (replaces brew-based interactive installs)
  selfConfigure:
    enabled: true
    allowedActions:
      - skills
      - config
      #      - envVars
      - workspaceFiles
  security:
    networkPolicy:
      enabled: true
      allowedIngressNamespaces:
        - "network"
        - "monitoring"
      additionalEgress:
        - ports:
            - port: 22
              protocol: TCP
            - port: 80 # Seerr, Sonarr, Radarr, Overseerr
              protocol: TCP
            - port: 443
              protocol: TCP
            - port: 4317 # OpenTelemetry Collector grpc
              protocol: TCP
            - port: 4318 # OpenTelemetry Collector
              protocol: TCP
            - port: 4483 # Toolhive MCP gateway
              protocol: TCP
            - port: 5000 # Frigate
              protocol: TCP
            - port: 6052 # ESPHome
              protocol: TCP
            - port: 6969 # Whisparr
              protocol: TCP
            - port: 8000 # Paperless-ng
              protocol: TCP
            - port: 8080
              protocol: TCP
            - port: 8123 # Home Assistant
              protocol: TCP
            - port: 8686 # Lidarr
              protocol: TCP
            - port: 9090 # Prometheus Monitoring
              protocol: TCP
            - port: 11434 # Ollama
              protocol: TCP
            - port: 50000
              protocol: TCP
    rbac:
      createServiceAccount: true
  # ── Skills ────────────────────────────────────────────────────
  # Fetched by init-skills container before the agent starts
  # Formats: "clawhub-slug" | "npm:package" | "pack:owner/repo/path"
  skills:
    - asleep123/caldav-calendar
    - hugogu/publish-wiki-js
    - pskoett/self-improving-agent
    - steipete/1password
    - steipete/brave-search
    - steipete/camsnap
    - steipete/discord
    - steipete/gemini
    - steipete/github
    - steipete/gog
    - steipete/mcporter
    - steipete/obsidian
    - steipete/openai-whisper
    - steipete/qmd
    - steipete/weather
  envFrom:
    - secretRef:
        name: openclaw-cortana-secret
  env:
    - name: ESPHOME_URL
      value: "http://esphome.home.svc.cluster.local:6052"
    - name: FRIGATE_URL
      value: "http://frigate.media.svc.cluster.local:5000"
    - name: PATH
      value: "/tools/bin:/home/openclaw/.openclaw/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    - name: TALOSCONFIG
      value: "/home/openclaw/.openclaw/talos/config"
    - name: N8N_URL
      value: "http://n8n.selfhosted.svc.cluster.local:8080"
    - name: NODERED_URL
      value: "http://nr.home.svc.cluster.local:1880"
    - name: OLLAMA_API_KEY
      value: "not-needed"
    - name: OLLAMA_BASE_URL
      value: "http://ollama.ai.svc.cluster.local:11434"
    - name: RADARR_URL
      value: "http://radarr.media.svc.cluster.local"
    - name: RADARR_UHD_URL
      value: "http://radarr-uhd.media.svc.cluster.local"
    - name: SEARXNG_URL
      value: "http://searxng.selfhosted.svc.cluster.local:8080"
    - name: SEERR_URL
      value: "http://requests.media.svc.cluster.local"
    - name: SEERR_USERS
      value: "me:1,rosemary:10"
    - name: SEERR_SERVERS
      value: "movies:0,kids-movies:1,tv:0,kids-tv:1"
    - name: SONARR_URL
      value: "http://sonarr.media.svc.cluster.local"
    - name: SONARR_UHD_URL
      value: "http://sonarr-uhd.media.svc.cluster.local"

  initContainers:
    - name: install-tools
      image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -euo pipefail
          mkdir -p /tools/bin /tools/home /tools/mise

          # Redirect all mise state to the shared tools volume
          export HOME=/tools/home
          export MISE_DATA_DIR=/tools/mise
          export MISE_CACHE_DIR=/tools/mise/cache
          export MISE_STATE_DIR=/tools/mise/state
          export MISE_CONFIG_FILE=/tools/mise.toml

          # Install mise (using musl binary for Alpine compatibility)
          curl -fsSL https://github.com/jdx/mise/releases/download/v2026.4.5/mise-v2026.4.5-linux-x64-musl > /tools/bin/mise
          chmod +x /tools/bin/mise

          /tools/bin/mise install --yes

          # Symlink from mise managed paths to /tools/bin
          ln -sf "$(/tools/bin/mise which gh)" /tools/bin/gh
          ln -sf "$(/tools/bin/mise which kubectl)" /tools/bin/kubectl
          ln -sf "$(/tools/bin/mise which talosctl)" /tools/bin/talosctl
      volumeMounts:
        - name: tools
          mountPath: /tools
        - name: mise-config
          mountPath: /tools/mise.toml
          subPath: mise.toml
  extraVolumes:
    - name: tools
      emptyDir: {}
    - name: mise-config
      configMap:
        name: cortana-mise-config
    - name: talos-config
      secret:
        secretName: openclaw-cortana-secret
        items:
          - key: TALOS_CONFIG
            path: config
  extraVolumeMounts:
    - name: tools
      mountPath: /tools
    - name: talos-config
      mountPath: /home/openclaw/.openclaw/talos/config
      subPath: config
  observability:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 15s
        labels:
          release: prometheus
    logging:
      level: info
      format: json

  storage:
    persistence:
      enabled: true
      existingClaim: openclaw-cortana
  config:
    mergeMode: "merge"
    raw:
      agents:
        defaults:
          heartbeat:
            every: "30m"
            model: "groq/openai/gpt-oss-20b"
            isolatedSession: true
            lightContext: true
            prompt: "Read HEARTBEAT.md if it exists (workspace context). Follow it strictly. Do not infer or repeat old tasks from prior chats. If nothing needs attention, reply HEARTBEAT_OK."
          model:
            primary: "groq/qwen/qwen3.6-27b"
            fallbacks:
              - "ollama-rig/gemma4:e4b"
              - "ollama/gemma4:e4b-it-q4_K_M"
          compaction:
            reserveTokensFloor: 24000
            reserveTokens: 2000
            keepRecentTokens: 4000
            notifyUser: true
            memoryFlush:
              enabled: true
              softThresholdTokens: 4000
              systemPrompt: "Session nearing compaction. Store durable memories now."
              prompt: "Write any lasting notes to memory/YYYY-MM-DD.md; reply with NO_REPLY if nothing to store."
          memorySearch:
            enabled: true
            provider: ollama
            model: nomic-embed-text
            remote:
              baseUrl: "http://ollama.ai.svc.cluster.local:11434"
              apiKey: "ollama-local"
            sources:
              - memory
      gateway:
        port: 18789
        controlUi:
          allowedOrigins:
            - "http://127.0.0.1:18789"
            - "http://localhost:18789"
            - "https://cortana.davidstewen.com"
          dangerouslyDisableDeviceAuth: true
      models:
        providers:
          ollama-rig:
            baseUrl: "http://192.168.10.87:11434"
            apiKey: "not-needed"
            api: "ollama"
            timeoutSeconds: 900
