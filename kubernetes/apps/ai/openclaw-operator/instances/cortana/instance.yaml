      messages:
        groupChat:
          visibleReplies: "automatic"

      channels:
        discord:
          groupPolicy: allowlist
          dmPolicy: pairing
          execApprovals:
            enabled: true
            approvers:
              - "376208104494465048"
          allowFrom:
            - "376208104494465048"
      tools:
        media:
          audio:
            enabled: true
            maxBytes: 20971520
            models:
              - provider: groq
                model: whisper-large-v3
        web:
          fetch:
            enabled: true
          search:
            provider: searxng
      plugins:
        bundledDiscovery: allowlist
        enabled: true
        allow:
          - "browser"
          - "diagnostics-otel"
          - "discord"
          - "elevenlabs"
          - "google"
          - "groq"
          - "memory-core"
          - "ollama"
          - "searxng"
          - "workboard"
        entries:
          diagnostics-otel:
            enabled: true
          elevenlabs:
            enabled: true
          searxng:
            config:
              webSearch:
                baseUrl: "http://searxng.selfhosted.svc.cluster.local:8080"
                language: "en"
          memory-core:
            config:
              dreaming:
                enabled: true
          workboard:
            enabled: true

      diagnostics:
        enabled: true
        otel:
          enabled: true
          logsEndpoint: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/logs"
          metricsEndpoint: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/metrics"
          tracesEndpoint: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces"
          headers:
            Authorization: "Bearer e57e0698ad3e3c4e443c694c4b7afab47a02d56f604362dbd9fd770628f5e27f"
          protocol: "http/protobuf"
          serviceName: "openclaw-gateway"
          traces: true
          metrics: true
          logs: true
          logsExporter: "both"
          sampleRate: 0.2
          flushIntervalMs: 60000
          captureContent: true

      mcp:
        servers:
          toolhive:
            url: "http://vmcp-mcp-gateway-internal.ai:4483/mcp"
            transport: "streamable-http"
            headers:
              Accept: "application/json, text/event-stream"
