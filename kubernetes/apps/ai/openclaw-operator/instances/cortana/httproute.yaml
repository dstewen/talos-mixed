---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openclaw
  namespace: ai
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: "OpenClaw Cortana AI Instance"
    gethomepage.dev/group: AI
    gethomepage.dev/name: OpenClaw Cortana
    gethomepage.dev/href: https://cortana.davidstewen.com
    gethomepage.dev/icon: sh-openclaw.png
    gethomepage.dev/pod-selector: app.kubernetes.io/name=openclaw
spec:
  hostnames:
    - cortana.davidstewen.com
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cortana
          port: 18789
