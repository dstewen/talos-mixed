---
# One member of the reranking pool. rerank-2.yaml is identical but for the
# name; keep them in step. Two single-replica services rather than one with
# replicas: 2, as upstream does it: litellm balances across them by name, and
# llmkube rolls each one on its own (rolloutPolicy below), so an image bump
# never takes both down together.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: &app rerank-1
  labels:
    krr/ignore: "true"
spec:
  modelRef: rerank
  modelCache:
    claimName: embeddings
  runtime: llamacpp
  # server-vulkan (not intel): intel image ships SYCL backend which crashes at
  # startup on CPU-only nodes (no Intel GPU device → "can not find preferred
  # GPU platform"). The vulkan image has no SYCL; if no Vulkan ICD is on the
  # host it gracefully falls back to CPU.
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:56df0a745f16eed7c819c929a9b40038d169509d8d3f05edc08fd11252d14c49
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 600
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "true"
    rerank-pool: "true"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchLabels:
                rerank-pool: "true"
            topologyKey: kubernetes.io/hostname
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  contextSize: 32768
  parallelSlots: 8
  flashAttention: true
  batchSize: 2048
  uBatchSize: 2048
  env:
    - name: HOME
      value: /tmp
  resources:
    cpu: 500m
    memory: 4Gi
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
  extraArgs:
    - --cont-batching
    - --cache-ram
    - "0"
    - --kv-unified
    - --threads
    - "8"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 5
      failureThreshold: 120
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 2
