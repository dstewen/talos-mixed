---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rerank
  namespace: flux-system
spec:
  path: ./kubernetes/apps/ai/rerank/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: ai
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    # Wait for the embeddings PVC to be ready, shared with the embed pool.
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  wait: true
  suspend: false
