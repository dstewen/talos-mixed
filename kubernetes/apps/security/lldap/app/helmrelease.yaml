---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lldap
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: lldap
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      lldap:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: lldap-secret
        containers:
          app:
            image:
              repository: ghcr.io/lldap/lldap
              tag: v0.6.3@sha256:2a8454b668c1aba7157e832eab0e242e1e7eb5fb7591d7e7774ba05286511ca8
            env:
              TZ: Australia/Victoria
              LLDAP_HTTP_PORT: &port 80
              LLDAP_HTTP_URL: https://lldap.davidstewen.com
              LLDAP_LDAP_PORT: &ldapPort 389
              LLDAP_LDAP_BASE_DN: dc=home,dc=arpa
            envFrom: *envFrom
            resources:
              requests:
                cpu: 5m
                memory: 36M
              limits:
                memory: 64M
        pod:
          #          affinity:
          #            nodeAffinity:
          #              requiredDuringSchedulingIgnoredDuringExecution:
          #                nodeSelectorTerms:
          #                - matchExpressions:
          #                  - key: node-role.kubernetes.io/worker
          #                    operator: In
          #                    values:
          #                    - worker
          #              preferredDuringSchedulingIgnoredDuringExecution:
          #              - weight: 1
          #                preference:
          #                  matchExpressions:
          #                  - key: kubernetes.io/arch
          #                    operator: In
          #                    values:
          #                    - arm64
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
    service:
      app:
        controller: lldap
        ports:
          http:
            port: *port
          ldap:
            port: *ldapPort
    #    ingress:
    #      app:
    #        enabled: true
    #        annotations:
    #          hajimari.io/enable: "true"
    #          hajimari.io/icon: mdi:account-multiple
    #          hajimari.io/info: "LLDAP instance for home.arpa"
    #          gethomepage.dev/enabled: "true"
    #          gethomepage.dev/icon: lldap.png
    #          gethomepage.dev/name: LLDAP
    #          gethomepage.dev/group: Infrastructure
    #          gethomepage.dev/description: OIDC User Management
    #        className: internal
    #        hosts:
    #          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
    #            paths:
    #              - path: /
    #                service:
    #                  identifier: app
    #                  port: http
    #        tls:
    #          - hosts:
    #              - *host

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: lldap.png
          gethomepage.dev/name: LLDAP
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/description: OIDC User Management
          gethomepage.dev/pod-selector: app.kubernetes.io/name=lldap
        hostnames: ["lldap.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      data:
        type: emptyDir
