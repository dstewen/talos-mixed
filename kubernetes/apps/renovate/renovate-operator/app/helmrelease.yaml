---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 1h
  values:
    fullnameOverride: renovate-operator
    auth:
      #      defaultAllowedGroups: "ldap_renovate_allow_access"
      oidc:
        additionalScopes:
          - groups
        enabled: true
        clientId: RENOVATE_OPERATOR_CLIENT_ID
        existingSecret: renovate-operator-oidc-credentials
        issuerUrl: https://id.davidstewen.com/application/o/renovate-operator/
        redirectScheme: https
        secretKey: RENOVATE_OPERATOR_CLIENT_SECRET
        sessionSecretKey: RENOVATE_OPERATOR_SESSION_SECRET

    authorization:
      # -- whether to enforce per-job access rules. When false, every user who passes authentication
      # -- holds admin access on every RenovateJob and all group and user rules are ignored, per-job
      # -- and operator-wide. Anonymous read still applies, so a public read-only dashboard is
      # -- unaffected. Has no effect when no authentication provider is configured, since every
      # -- request is an admin in that case.
      enabled: false
      # -- default access rules. Each field applies to RenovateJobs that leave the matching field in
      # -- spec.access unset. A field the job does set replaces the default for that field instead of
      # -- adding to it, so a per-job spec.access can narrow access as well as widen it.
      defaults:
        # -- groups granted read-only access (view jobs, projects and logs, no actions)
        readerGroups: ["ldap_renovate_allow_access"]
        # -- groups granted full access (view plus trigger, cancel and discovery)
        adminGroups: ["ldap_renovate_allow_admin_access"]
        # -- individual accounts granted read-only access, by email or username
        readerUsers: []
        # -- individual accounts granted full access, by email or username
        adminUsers: [dstewen]
        # -- whether RenovateJobs are readable without a session (public dashboard)
        anonymousRead: false
        # -- whether visitors holding only anonymous read access may stream Renovate logs (logs are unredacted)
        anonymousReadLogs: false

    metrics:
      enabled: true
      serviceMonitor:
        # -- whether to create a ServiceMonitor for the operator metrics
        enabled: true
        # -- scrape interval for the ServiceMonitor, defaults to Prometheus global scrape interval
      #        interval: ~
      dashboard:
        # -- whether to create a Grafana dashboard for the operator metrics
        enabled: true
        grafanaDashboard:
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              dashboards: grafana

    policy:
      allowedHosts:
        - api.github.com
        - github.com
        - gitlab.com
        - api.bitbucket.org
        - bitbucket.org
        - gitea.com
        - codeberg.org
        - quay.io

    route:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Update-Management
        gethomepage.dev/name: Renovate-Operator
        gethomepage.dev/icon: renovate.png
        gethomepage.dev/pod-selector: app.kubernetes.io/controller=renovate-operator
        gethomepage.dev/href: https://renovate.davidstewen.com
      hostnames:
        - renovate.davidstewen.com
      parentRefs:
        - name: envoy-internal
          namespace: network

    valkey:
      enabled: true
      auth:
        enabled: false
        aclUsers:
          default:
            password: ""
            permissions: "~* &* +@all"
      dataStorage:
        enabled: true # sessions are ephemeral

    webhook:
      enabled: true
  valuesFrom:
    - kind: Secret
      name: renovate-operator-oidc-credentials
      valuesKey: RENOVATE_OPERATOR_CLIENT_ID
      targetPath: auth.oidc.clientId
