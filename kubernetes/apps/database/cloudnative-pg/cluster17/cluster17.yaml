---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5-5
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: openebs-hostpath-1tb
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  # Note: Bootstrap is needed when recovering from an existing cnpg cluster
  bootstrap:
    recovery:
      source: source
      recoveryTarget:
        targetTime: "2026-02-06 00:00:00.00000+00"
  #    initdb:
  #      import:
  #        type: monolith
  #        databases: ["*"]
  #        roles: ["*"]
  #        source:
  #          externalCluster: cnpg16
  postgresql:
    parameters:
      max_connections: "600"
      max_slot_wal_keep_size: 10GB
      shared_buffers: 512MB
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
  monitoring:
    enablePodMonitor: false

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio
        serverName: postgres17-v8

  #  backup:
  #    retentionPolicy: 30d
  #    barmanObjectStore:
  #      wal:
  #        compression: bzip2
  #        maxParallel: 8
  #      data:
  #        compression: bzip2
  #      destinationPath: s3://cnpg-backups-new/
  #      endpointURL: http://192.168.10.198:9000
  #      serverName: &currentCluster postgres17-v3
  #      s3Credentials:
  #        accessKeyId:
  #          name: cloudnative-pg-secret
  #          key: aws-access-key-id
  #        secretAccessKey:
  #          name: cloudnative-pg-secret
  #          key: aws-secret-access-key
  # Note: externalClusters is needed when recovering from an existing cnpg cluster
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: minio
          serverName: postgres17-v4
