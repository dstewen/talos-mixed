---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  chartRef:
    kind: OCIRepository
    name: nvidia-gpu-operator
  interval: 1h
  timeout: 20m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 0
  values:
    daemonsets:
      tolerations:
        - key: key
          operator: Equal
          value: llm-workload
          effect: NoSchedule
    # Talos provides NVIDIA drivers via system extensions
    driver:
      enabled: false

    # Talos provides NVIDIA container toolkit via system extensions
    toolkit:
      enabled: false

    # Disable device plugin — replaced by the DRA GPU driver
    devicePlugin:
      enabled: false

    # Disable GPU operator's NFD - use kube-system NFD instead
    nfd:
      enabled: false
    node-feature-discovery:
      enabled: false

    dcgmExporter:
      serviceMonitor:
        enabled: true

    # Talos installs drivers via system extensions under /usr/local
    hostPaths:
      driverInstallDir: /usr/local
