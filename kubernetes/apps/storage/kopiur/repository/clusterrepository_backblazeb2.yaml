---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: backblazeb2
spec:
  allowedNamespaces:
    all: true
  backend:
    # Use the S3 backend for Backblaze B2, as it is compatible with the S3 API.
    # With onsite and offsite repositories, the S3 backend is preferred for the offsite repository,
    # as there is ther tooling using S3 protocol. Custom components in kubernetes/components/ are reliant
    # on using the S3 backend for the offsite repository. The documentation recommends using the S3 backend
    # if using outside tooling. see https://github.com/home-operations/kopiur/blob/main/docs/backends/b2.md
    s3:
      auth:
        secretRef:
          name: kopiur-offsite-repository-auth-secret
          namespace: storage
      bucket: volsync-backups-kopia
      endpoint: s3.us-west-002.backblazeb2.com
      region: us-west-002
  encryption:
    passwordSecretRef:
      name: kopiur-offsite-repository-encryption-secret
      namespace: storage
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    cache:
      # Every cache PVC is 5Gi or larger (KOPIUR_CAPACITY default). Kopia's own
      # defaults are 5000 MiB per budget, larger than the whole PVC, so the
      # sweeper never runs and the cache fills the volume. The metadata budget
      # applies twice: kopia caps the index-blobs cache at the same size.
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: Australia/Melbourne
