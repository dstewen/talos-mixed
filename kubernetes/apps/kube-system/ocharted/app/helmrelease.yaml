---
# yaml-language-server: $schema=https://k8s-schemas.wynning.tech/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ocharted
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: ocharted
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    auth:
      existingSecret: ocharted-secret
      bypassNetworks:
        - 10.42.0.0/16
        - 10.205.15.0/24
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      # Keep this proxy an explicit SSRF boundary: only known chart hosts are reachable.
      upstreamAllowlist:
        - aquasecurity.github.io
        - ceph.github.io
        - kedacore.github.io
        - kubernetes-sigs.github.io
        - pkgs.tailscale.com
        - jmcgrath207.github.io
        - jameswynn.github.io
      logLevel: info
      logFormat: json
    httpRoute:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/target: external.davidstewen.com
        external-dns.kubernetes.io/target: external.davidstewen.com
      hostnames:
        - ocharted.davidstewen.com
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 768Mi
